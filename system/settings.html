<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات النظام | معامل طيبة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=125"></script>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --surface: #1e293b; --primary: #10b981; --text: #f8fafc; --border: #334155; --text-muted: #94a3b8; --danger: #ef4444;}
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Almarai', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .header h1 { color: var(--primary); }
        .btn-back { background: var(--border); color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card h2 { color: var(--primary); font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px dashed var(--border); padding-bottom: 10px;}
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: white; }
        .btn-save { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px;}
        .btn-save:hover { background: #059669; color: white; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #000; padding: 10px 20px; border-radius: 8px; display: none; font-weight: bold; z-index: 1000; }
        .logo-preview { height: 80px; margin-bottom: 15px; border-radius: 8px; background: #fff; padding: 5px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ إعدادات النظام</h1>
            <a href="home.html" class="btn-back">عودة للرئيسية</a>
        </div>

        <!-- 1. بيانات المعمل واللوجو -->
        <div class="card">
            <h2>بيانات المعمل واللوجو</h2>
            <div class="row">
                <div class="form-group"><label>اسم المعمل</label><input type="text" id="setLabName"></div>
                <div class="form-group"><label>اسم الدكتور</label><input type="text" id="setDoctorName"></div>
            </div>
            <div class="row">
                <div class="form-group"><label>رقم الهاتف</label><input type="text" id="setPhone"></div>
                <div class="form-group"><label>رقم الواتساب</label><input type="text" id="setWhatsapp"></div>
            </div>
            <div class="form-group">
                <label>رفع لوجو المعمل (PNG / JPG)</label>
                <img id="logoPreview" class="logo-preview" src="" alt="Logo Preview">
                <input type="file" id="logoFile" accept="image/*" style="border: none; padding: 5px;">
            </div>
            <button class="btn-save" onclick="saveLabInfo()">💾 حفظ البيانات واللوجو</button>
        </div>

        <!-- 2. إدارة الموظفين -->
        <div class="card">
            <h2>إضافة موظف جديد</h2>
            <div class="row">
                <div class="form-group"><label>إيميل الموظف</label><input type="email" id="empEmail" placeholder="emp@teba.com"></div>
                <div class="form-group"><label>باسورد الموظف</label><input type="password" id="empPass" placeholder="********"></div>
            </div>
            <button class="btn-save" style="background:#3b82f6; color:white;" onclick="addEmployee()">➕ إضافة الموظف</button>
        </div>

        <!-- 3. تغيير باسورد الدكتور (جديد) -->
        <div class="card" style="border-color: var(--danger);">
            <h2 style="color: var(--danger);">🔑 تغيير كلمة المرور (للدكتور)</h2>
            <div class="row">
                <div class="form-group"><label>كلمة المرور الجديدة</label><input type="password" id="newPassword" placeholder="********"></div>
                <div class="form-group"><label>تأكيد كلمة المرور</label><input type="password" id="confirmPassword" placeholder="********"></div>
            </div>
            <button class="btn-save" style="background:var(--danger); color:white;" onclick="changeMyPassword()">🔐 تحديث كلمة المرور</button>
        </div>

        <!-- 4. محرك رفع البيانات القديمة -->
        <div class="card">
            <h2>محرك رفع البيانات القديمة (CSV)</h2>
            <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:10px;">يرجى رفع ملف CSV يحتوي على أعمدة (اسم المريض، رقم الزيارة، اسم التحليل، النتيجة). سيتم معالجة البيانات وإدخالها فوراً.</p>
            <input type="file" id="csvFile" accept=".csv" style="margin-bottom:10px;">
            <button class="btn-save" style="background:#d97706; color:white;" onclick="importCSV()">📤 بدء الرفع والمعالجة</button>
            <div id="importProgress" style="margin-top:10px; font-weight:bold; color:var(--primary);"></div>
        </div>
    </div>
    
    <div id="toast">✅ تم الحفظ</div>    <script>
        const _supabase = supabase.createClient(TEBA_CONFIG.supabase.url, TEBA_CONFIG.supabase.key);
        const tenantId = TEBA_CONFIG.tenant.id;
        let currentLogoUrl = '';

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        // 1. تحميل البيانات الحالية
        async function loadSettings() {
            const { data } = await _supabase.from('site_settings').select('*').eq('tenant_id', tenantId).single();
            if (data) {
                document.getElementById('setLabName').value = data.lab_name || '';
                document.getElementById('setDoctorName').value = data.doctor_name || '';
                document.getElementById('setPhone').value = data.phone || '';
                document.getElementById('setWhatsapp').value = data.whatsapp || '';
                if (data.logo_url) {
                    currentLogoUrl = data.logo_url;
                    const preview = document.getElementById('logoPreview');
                    preview.src = data.logo_url;
                    preview.style.display = 'block';
                }
            }
        }

        // 2. حفظ البيانات واللوجو
        async function saveLabInfo() {
            const btn = document.querySelector('.card:nth-child(1) .btn-save');
            btn.innerText = '⏳ جاري الحفظ...'; btn.disabled = true;
            
            try {
                const labName = document.getElementById('setLabName').value;
                const fileInput = document.getElementById('logoFile');
                let finalLogoUrl = currentLogoUrl;

                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileExt = file.name.split('.').pop();
                    const fileName = `logo_${tenantId}_${Date.now()}.${fileExt}`;
                    
                    const { error: uploadError } = await _supabase.storage.from('lab-assets').upload(fileName, file);
                    if (uploadError) throw uploadError;

                    const { data: urlData } = _supabase.storage.from('lab-assets').getPublicUrl(fileName);
                    finalLogoUrl = urlData.publicUrl;
                    currentLogoUrl = finalLogoUrl;
                }

                const updates = {
                    tenant_id: tenantId,
                    lab_name: labName,
                    doctor_name: document.getElementById('setDoctorName').value,
                    phone: document.getElementById('setPhone').value,
                    whatsapp: document.getElementById('setWhatsapp').value,
                    logo_url: finalLogoUrl
                };
                
                const { error: settingsErr } = await _supabase.from('site_settings').upsert(updates, { onConflict: 'tenant_id' });
                if (settingsErr) throw settingsErr;

                await _supabase.from('tenants').update({ name: labName }).eq('id', tenantId);

                localStorage.setItem('teba_tenant_name', labName);
                TEBA_CONFIG.lab.name = labName;
                
                showToast('✅ تم حفظ البيانات واللوجو بنجاح');
                if(finalLogoUrl) {
                    const preview = document.getElementById('logoPreview');
                    preview.src = finalLogoUrl; preview.style.display = 'block';
                }
            } catch (err) {
                alert('❌ خطأ: ' + err.message);
            } finally {
                btn.innerText = '💾 حفظ البيانات واللوجو'; btn.disabled = false;
            }
        }

        // 3. إضافة موظف جديد
        async function addEmployee() {
            const email = document.getElementById('empEmail').value.trim();
            const password = document.getElementById('empPass').value;
            if (!email || !password) return alert('يرجى إدخال الإيميل والباسورد');

            const btn = document.querySelector('.card:nth-child(2) .btn-save');
            btn.innerText = '⏳ جاري الإضافة...'; btn.disabled = true;

            try {
                const { error } = await _supabase.rpc('create_employee', {
                    emp_email: email,
                    emp_password: password,
                    emp_tenant_id: tenantId,
                    emp_role: 'employee'
                });
                if (error) throw error;
                alert('✅ تم إضافة الموظف بنجاح!');
                document.getElementById('empEmail').value = '';
                document.getElementById('empPass').value = '';
            } catch (err) {
                alert('❌ خطأ: ' + err.message);
            } finally {
                btn.innerText = '➕ إضافة الموظف'; btn.disabled = false;
            }
        }

        // 4. تغيير باسورد الدكتور
        async function changeMyPassword() {
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (!newPass || newPass.length < 6) return alert('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
            if (newPass !== confirmPass) return alert('كلمتا المرور غير متطابقتين');

            const btn = document.querySelector('.card:nth-child(3) .btn-save');
            btn.innerText = '⏳ جاري التحديث...'; btn.disabled = true;

            try {
                const { error } = await _supabase.auth.updateUser({ password: newPass });
                if (error) throw error;
                alert('✅ تم تغيير كلمة المرور بنجاح!');
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
            } catch (err) {
                alert('❌ خطأ: ' + err.message);
            } finally {
                btn.innerText = '🔐 تحديث كلمة المرور'; btn.disabled = false;
            }
        }

        // 5. محرك رفع البيانات القديمة (CSV) الذكي
        async function importCSV() {
            const fileInput = document.getElementById('csvFile');
            const progressEl = document.getElementById('importProgress');
            if (!fileInput.files.length) return alert('اختر ملف CSV أولاً');
            
            const file = fileInput.files[0];
            const reader = new FileReader();
            progressEl.innerText = '⏳ جاري قراءة الملف...';

            reader.onload = async function(e) {
                const text = e.target.result;
                const lines = text.split('\n').filter(line => line.trim() !== '');
                if (lines.length < 2) return alert('الملف فارغ أو غير صالح');

                // قراءة أسماء الأعمدة من السطر الأول
                const headers = lines[0].split(',').map(h => h.trim().replace(/['"]/g, '').toLowerCase());
                
                // البحث عن الأعمدة المطلوبة مهما كانت أسمائها
                const nameIdx = headers.findIndex(h => h.includes('اسم') || h.includes('name') || h.includes('مريض'));
                const visitIdx = headers.findIndex(h => h.includes('زيار') || h.includes('visit') || h.includes('id') || h.includes('رقم'));
                const testIdx = headers.findIndex(h => h.includes('تحليل') || h.includes('test') || h.includes('فحص'));
                const resultIdx = headers.findIndex(h => h.includes('نتيج') || h.includes('result') || h.includes('قيمة'));

                if (nameIdx === -1 || visitIdx === -1 || testIdx === -1 || resultIdx === -1) {
                    return alert('❌ لم يتم العثور على الأعمدة المطلوبة. تأكد من وجود أعمدة (اسم المريض، رقم الزيارة، التحليل، النتيجة)');
                }

                const dataRows = lines.slice(1);
                let successCount = 0;
                let failCount = 0;
                const batchSize = 50; // رفع 50 حالة في المرة

                progressEl.innerText = `⏳ جاري معالجة ${dataRows.length} حالة...`;

                for (let i = 0; i < dataRows.length; i += batchSize) {
                    const batch = dataRows.slice(i, i + batchSize);
                    let patientsBatch = [], visitsBatch = [], testsBatch = [], resultsBatch = [];

                    for (let rowStr of batch) {
                        try {
                            // تقسيم بسيط (لو فيه مشكلة في الفواصل جوه النص، ممكن يحتاج Regex أقوى لاحقاً)
                            const cols = rowStr.split(',').map(c => c.trim().replace(/['"]/g, ''));
                            
                            const pName = cols[nameIdx];
                            const visitId = parseInt(cols[visitIdx]);
                            const testName = cols[testIdx];
                            const resultVal = cols[resultIdx];

                            if (!pName || !visitId) continue;

                            const pId = crypto.randomUUID();
                            const vtId = crypto.randomUUID();

                            patientsBatch.push({ id: pId, tenant_id: tenantId, name: pName, phone: '' });
                            visitsBatch.push({ client_uuid: crypto.randomUUID(), visit_id: visitId, tenant_id: tenantId, patient_id: pId, branch_id: 1, status: 'Pending', visit_date: new Date().toISOString() });
                            testsBatch.push({ id: vtId, tenant_id: tenantId, visit_id: visitId, test_code: testName });
                            resultsBatch.push({ id: crypto.randomUUID(), tenant_id: tenantId, visit_test_id: vtId, results_data: { "Result": { value: resultVal } } });
                            
                            successCount++;
                        } catch (err) {
                            failCount++;
                        }
                    }

                    // رفع الدفعة للسحابة
                    if (patientsBatch.length > 0) {
                        await _supabase.from('patients').insert(patientsBatch);
                        await _supabase.from('visits').insert(visitsBatch);
                        await _supabase.from('visit_tests').insert(testsBatch);
                        await _supabase.from('test_results').insert(resultsBatch);
                    }
                    
                    progressEl.innerText = `⏳ تم رفع ${successCount} حالة... (فشل: ${failCount})`;
                }
                progressEl.innerText = `✅ انتهى الرفع! نجح: ${successCount} | فشل: ${failCount}`;
                fileInput.value = '';
            };
            reader.readAsText(file);
        }

        // تشغيل الدالة عند فتح الصفحة
        window.onload = loadSettings;
    </script>
</body>
</html>
