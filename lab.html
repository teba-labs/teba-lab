<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معامل طيبة - بوابة المعمل (v15.1)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-bg: #f4f7f6; --surface-bg: #ffffff; --primary-color: #2c3e50;
            --accent-color: #3498db; --success-color: #2ecc71; --danger-color: #e74c3c;
            --warning-color: #f39c12; --text-main: #333; --text-muted: #7f8c8d; 
            --border-color: #dcdde1; --shadow-sm: 0 2px 5px rgba(0,0,0,0.05);
            --shadow-md: 0 5px 15px rgba(0,0,0,0.08); --radius: 8px; 
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-family); background-color: var(--primary-bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background-color: var(--primary-color); color: white; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; box-shadow: var(--shadow-md); z-index: 10; }
        .brand-info { font-weight: bold; font-size: 1.1rem; }
        .nav-btn { background: var(--accent-color); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: inherit; text-decoration: none;}

        .main-container { display: grid; grid-template-columns: 350px 1fr 1fr; gap: 15px; padding: 15px; flex-grow: 1; height: calc(100vh - 60px); overflow: hidden; }
        .panel { background: var(--surface-bg); border-radius: var(--radius); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; border: 1px solid var(--border-color); overflow: hidden; }
        .panel-header { background: #f8f9fa; padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-weight: bold; color: var(--primary-color); text-align: center;}

        .queue-list { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px;}
        .queue-card { padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; background: #fff;}
        .queue-card:hover { border-color: var(--accent-color); box-shadow: var(--shadow-sm); }
        .queue-card.active { border-color: var(--accent-color); background: #eaf4fc; border-right: 5px solid var(--accent-color); }
        .queue-card.pending { background: #fff3cd; border-right: 5px solid var(--warning-color); }
        .queue-card.done { background: #d4edda; border-right: 5px solid var(--success-color); }
        .q-name { font-weight: bold; color: var(--primary-color); font-size: 1.1rem;}
        .q-meta { font-size: 0.8rem; color: #555; }

        .test-list { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px;}
        .test-card { background: #fff; border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; }
        .test-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 10px; font-weight: bold; color: var(--primary-color);}
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #555;}
        .input-group input { width: 100%; padding: 10px; border: 2px solid #ccc; border-radius: 6px; font-size: 1rem; font-weight: bold; text-align: center; outline: none; transition: 0.2s;}
        .input-group input:focus { border-color: var(--accent-color); box-shadow: 0 0 5px rgba(52,152,219,0.3); background: #fdfbf7;}
        .input-group input.saved { border-color: var(--success-color); background: #f0fff4;}
        
        .btn-save-test { width: 100%; padding: 8px; background: var(--success-color); color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px;}
        .empty-msg { text-align: center; color: var(--text-muted); margin-top: 50px; font-size: 1.1rem; }

        #printArea { display: none; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; display: block !important; padding: 20px;}
            .print-header { text-align: center; border-bottom: 2px solid #000; margin-bottom: 20px; padding-bottom: 10px;}
            .print-info { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 1.1rem;}
            .print-table { width: 100%; border-collapse: collapse; margin-bottom: 20px;}
            .print-table th, .print-table td { border: 1px solid #000; padding: 8px; text-align: right;}
            .print-table th { background: #f0f0f0; }
            .flag-high { color: red; font-weight: bold; }
            .flag-low { color: blue; font-weight: bold; }
            .flag-normal { color: green; font-weight: bold; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-info">🔬 المعمل - معامل طيبة (v15.1)</div>
        <div style="display:flex; gap:10px;">
            <button class="nav-btn" style="background: var(--warning-color);" onclick="printCurrentVisit()">🖨️ طباعة تقرير الزيارة</button>
            <a href="reception.html" class="nav-btn">🏥 الاستقبال</a>
        </div>
    </header>

    <div class="main-container">
        <div class="panel">
            <div class="panel-header">طابور المرضى</div>
            <div class="queue-list" id="queueList"><div class="empty-msg">جاري التحميل...</div></div>
        </div>
        <div class="panel">
            <div class="panel-header">التحاليل الفردية (Single)</div>
            <div class="test-list" id="singleTestsArea"><div class="empty-msg">اختر مريض من القائمة</div></div>
        </div>
        <div class="panel">
            <div class="panel-header">التحاليل المركبة (Profiles)</div>
            <div class="test-list" id="profileTestsArea"><div class="empty-msg">اختر مريض من القائمة</div></div>
        </div>
    </div>

    <div id="printArea"></div>

    <script>
        const supabaseUrl = 'https://khjzoleiuiipyodpkieg.supabase.co';
        const supabaseKey = 'sb_publishable_2Q7SPvruXJar3gvOxtvl5w_p4CVDfcU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let visitsData = [], patientsMap = {}, catalogMap = {}, testsMap = {}, resultsMap = {}, currentVisitId = null;

        async function loadAllData() {
            const { data: visits } = await _supabase.from('visits').select('*').order('visit_id', { ascending: false });
            const { data: patients } = await _supabase.from('patients').select('*');
            const { data: tests } = await _supabase.from('visit_tests').select('*');
            const { data: catalog } = await _supabase.from('tests_catalog').select('*');
            const { data: results } = await _supabase.from('test_results').select('*');

            patients?.forEach(p => patientsMap[p.id] = p);
            catalog?.forEach(c => catalogMap[c.code] = c);
            results?.forEach(r => resultsMap[r.visit_test_id] = r);
            
            testsMap = {};
            tests?.forEach(t => {
                if(!testsMap[t.visit_id]) testsMap[t.visit_id] = [];
                testsMap[t.visit_id].push(t);
            });

            visitsData = visits || [];
            renderQueue();
        }

        // دالة مساعدة عشان نعرف التحليل ده اكتمل ولا لسه
        function isTestDone(vt) {
            const res = resultsMap[vt.id];
            if(!res || !res.results_data) return false;
            const cat = catalogMap[vt.test_code];
            
            if(cat && cat.parameters && cat.parameters.length > 0) {
                // لو مركب، لازم كل الباراميترز تكون متكتوبة
                return cat.parameters.every(p => res.results_data[p.name] && res.results_data[p.name].value);
            } else {
                // لو فردي، لازم النتيجة تكون متكتوبة
                return res.results_data['result'] && res.results_data['result'].value;
            }
        }

        function renderQueue() {
            const list = document.getElementById('queueList');
            list.innerHTML = '';
            
            visitsData.forEach(v => {
                const patient = patientsMap[v.patient_id] || {};
                const vTests = testsMap[v.visit_id] || [];
                if(vTests.length === 0) return;

                const isDone = vTests.every(t => isTestDone(t)); // التعديل هنا
                const statusClass = isDone ? 'done' : 'pending';
                const activeClass = (currentVisitId === v.visit_id) ? 'active' : '';

                const card = document.createElement('div');
                card.className = `queue-card ${statusClass} ${activeClass}`;
                card.onclick = () => selectVisit(v.visit_id);
                card.innerHTML = `
                    <div>
                        <div class="q-name">${patient.name || patient.full_name || 'غير معروف'}</div>
                        <div class="q-meta">زيارة #${v.visit_id} • ${patient.age} سنة • ${patient.gender === 'male' || patient.gender === 'ذكر' ? 'ذكر' : 'أنثى'}</div>
                    </div>
                    <div style="font-size: 1.5rem;">${isDone ? '✅' : '⏳'}</div>
                `;
                list.appendChild(card);
            });
        }

        function selectVisit(visitId) {
            currentVisitId = visitId;
            renderQueue(); 

            const vTests = testsMap[visitId] || [];
            const patient = patientsMap[visitsData.find(v => v.visit_id === visitId)?.patient_id] || {};
            
            const singles = vTests.filter(t => !catalogMap[t.test_code]?.parameters || catalogMap[t.test_code].parameters.length === 0);
            const profiles = vTests.filter(t => catalogMap[t.test_code]?.parameters && catalogMap[t.test_code].parameters.length > 0);

            renderTests(singles, 'singleTestsArea', patient);
            renderTests(profiles, 'profileTestsArea', patient);
        }

        function renderTests(tests, containerId, patient) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if(tests.length === 0) {
                container.innerHTML = '<div class="empty-msg">لا توجد تحاليل هنا</div>';
                return;
            }

            tests.forEach(vt => {
                const cat = catalogMap[vt.test_code] || { name: vt.test_code, parameters: [] };
                const result = resultsMap[vt.id];
                
                const card = document.createElement('div');
                card.className = 'test-card';
                
                let inputsHtml = '';
                
                if(cat.parameters.length > 0) {
                    cat.parameters.forEach((param, index) => {
                        const val = result?.results_data?.[param.name]?.value || '';
                        const isFirst = index === 0 && !val ? 'autofocus' : '';
                        inputsHtml += `
                            <div class="input-group">
                                <label>${param.label} (${param.unit}) - [${param.ref_male}]</label>
                                <input type="text" id="inp_${vt.id}_${param.name}" value="${val}" class="${val ? 'saved':''}" 
                                       onkeydown="handleEnter(event, '${vt.id}', '${param.name}')" ${isFirst}>
                            </div>
                        `;
                    });
                } else {
                    const val = result?.results_data?.['result']?.value || '';
                    inputsHtml += `
                        <div class="input-group">
                            <label>النتيجة</label>
                            <input type="text" id="inp_${vt.id}_result" value="${val}" class="${val ? 'saved':''}" 
                                   onkeydown="handleEnter(event, '${vt.id}', 'result')" ${!val ? 'autofocus':''}>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="test-header">
                        <span>${cat.name}</span>
                        <span style="font-size:0.8rem; background:#eee; padding:2px 6px; border-radius:4px;">${vt.test_code}</span>
                    </div>
                    ${inputsHtml}
                    <button class="btn-save-test" onclick="saveTestManual('${vt.id}')">💾 حفظ (أو اضغط Enter)</button>
                `;
                container.appendChild(card);
            });

            setTimeout(() => {
                const firstInput = container.querySelector('input[autofocus]');
                if(firstInput) firstInput.focus();
            }, 100);
        }

        window.handleEnter = async function(event, vtId, paramName) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const input = event.target;
                const value = input.value.trim();
                
                if(value) {
                    await saveResultToCloud(vtId, paramName, value);
                    input.classList.add('saved');
                }
                focusNextInput(input);
            }
        };

        function focusNextInput(currentInput) {
            const allInputs = Array.from(document.querySelectorAll('.test-list input'));
            const currentIndex = allInputs.indexOf(currentInput);
            if (currentIndex > -1 && currentIndex < allInputs.length - 1) {
                allInputs[currentIndex + 1].focus();
            }
        }

        window.saveTestManual = async function(vtId) {
            const inputs = document.querySelectorAll(`[id^="inp_${vtId}_"]`);
            let savedCount = 0;
            for(let input of inputs) {
                if(input.value.trim()) {
                    const paramName = input.id.replace(`inp_${vtId}_`, '');
                    await saveResultToCloud(vtId, paramName, input.value.trim());
                    input.classList.add('saved');
                    savedCount++;
                }
            }
            if(savedCount > 0) alert('تم حفظ النتائج');
        };

        async function saveResultToCloud(vtId, paramName, value) {
            // تحديث الذاكرة المحلية أولاً (عشان نمنع مشاكل السرعة)
            if(!resultsMap[vtId]) resultsMap[vtId] = { visit_test_id: vtId, results_data: {} };
            if(!resultsMap[vtId].results_data) resultsMap[vtId].results_data = {};
            resultsMap[vtId].results_data[paramName] = { value: value };
            
            // الحفظ في السحابة
            const { error } = await _supabase.from('test_results').upsert({
                visit_test_id: vtId,
                results_data: resultsMap[vtId].results_data
            }, { onConflict: 'visit_test_id' });

            if(!error) {
                renderQueue(); 
            } else {
                alert('خطأ في الحفظ: ' + error.message);
            }
        }

        window.printCurrentVisit = function() {
            if(!currentVisitId) return alert('اختر مريض أولاً');
            
            const visit = visitsData.find(v => v.visit_id === currentVisitId);
            const patient = patientsMap[visit.patient_id] || {};
            const vTests = testsMap[currentVisitId] || [];
            
            let tableRows = '';
            let hasResults = false;

            vTests.forEach(vt => {
                const cat = catalogMap[vt.test_code] || { name: vt.test_code, parameters: [] };
                const res = resultsMap[vt.id]?.results_data || {};
                
                if(cat.parameters.length > 0) {
                    cat.parameters.forEach(p => {
                        if(res[p.name]?.value) {
                            hasResults = true;
                            const val = res[p.name].value;
                            const flag = checkFlag(val, p.ref_male, p.ref_female, patient.gender);
                            const flagHtml = flag === 'high' ? '<span class="flag-high">H</span>' : flag === 'low' ? '<span class="flag-low">L</span>' : '<span class="flag-normal">N</span>';
                            tableRows += `
                                <tr>
                                    <td>${cat.name} - ${p.label}</td>
                                    <td><strong>${val}</strong></td>
                                    <td>${p.unit || '-'}</td>
                                    <td>${patient.gender === 'female' || patient.gender === 'أنثى' ? p.ref_female : p.ref_male}</td>
                                    <td>${flagHtml}</td>
                                </tr>
                            `;
                        }
                    });
                } else {
                    if(res['result']?.value) {
                        hasResults = true;
                        tableRows += `
                            <tr>
                                <td>${cat.name}</td>
                                <td><strong>${res['result'].value}</strong></td>
                                <td>-</td>
                                <td>-</td>
                                <td>N</td>
                            </tr>
                        `;
                    }
                }
            });

            if(!hasResults) return alert('لا توجد نتائج محفوظة لطباعتها لهذا المريض.');

            const printContent = `
                <div class="print-header">
                    <h1>معامل طيبة للتحاليل الطبية</h1>
                    <p>تقرير نتائج التحاليل</p>
                </div>
                <div class="print-info">
                    <div>
                        <strong>المريض:</strong> ${patient.name || patient.full_name || 'غير معروف'} <br>
                        <strong>العمر/النوع:</strong> ${patient.age} سنة / ${patient.gender === 'male' || patient.gender === 'ذكر' ? 'ذكر' : 'أنثى'}
                    </div>
                    <div style="text-align: left;">
                        <strong>رقم الزيارة:</strong> ${visit.visit_id} <br>
                        <strong>التاريخ:</strong> ${new Date().toLocaleString('ar-EG')}
                    </div>
                </div>
                <table class="print-table">
                    <thead>
                        <tr>
                            <th>الفحص</th>
                            <th>النتيجة</th>
                            <th>الوحدة</th>
                            <th>المدى المرجعي</th>
                            <th>الحالة</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>
                <div style="text-align: center; margin-top: 50px;">
                    <p>توقيع الطبيب / الختم</p>
                </div>
            `;

            document.getElementById('printArea').innerHTML = printContent;
            window.print();
        };

        function checkFlag(val, refMale, refFemale, gender) {
            if(!val || isNaN(val)) return 'normal';
            const ref = (gender === 'female' || gender === 'أنثى') ? refFemale : refMale;
            if(!ref) return 'normal';
            
            const range = ref.match(/([\d.]+)\s*[-–]\s*([\d.]+)/);
            if (range) {
                const num = parseFloat(val);
                if (num < parseFloat(range[1])) return 'low';
                if (num > parseFloat(range[2])) return 'high';
            }
            return 'normal';
        }

        window.onload = loadAllData;
    </script>
</body>
</html>
