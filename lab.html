<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معامل طيبة - المعمل الذكي (v19)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-bg: #f4f7f6; --surface-bg: #ffffff; --primary-color: #2c3e50;
            --accent-color: #3498db; --success-color: #2ecc71; --danger-color: #e74c3c;
            --warning-color: #f39c12; --text-main: #333; --text-muted: #7f8c8d; 
            --border-color: #dcdde1; --radius: 8px; 
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-family); background-color: var(--primary-bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background-color: var(--primary-color); color: white; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 10; }
        .brand-info { font-weight: bold; font-size: 1.2rem; }
        .nav-btn { background: var(--accent-color); color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 1rem;}
        .nav-btn.print { background: var(--warning-color); color: #333; margin-left: 10px;}

        .main-grid { display: grid; grid-template-columns: 300px 1fr 1fr; gap: 15px; padding: 15px; flex-grow: 1; height: calc(100vh - 60px); }
        .panel { background: var(--surface-bg); border-radius: var(--radius); box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; border: 1px solid var(--border-color); overflow: hidden; }
        .panel-header { background: #f8f9fa; padding: 15px; border-bottom: 1px solid var(--border-color); font-weight: bold; color: var(--primary-color); text-align: center; font-size: 1.1rem;}

        .patient-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .patient-card { padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; background: white; }
        .patient-card:hover { border-color: var(--accent-color); background: #f0f8ff; }
        .patient-card.active { border-color: var(--accent-color); background: #e1f0fa; border-right: 4px solid var(--accent-color); }
        .p-name { font-weight: bold; margin-bottom: 5px; color: var(--primary-color);}
        .p-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between;}

        .tests-list { flex-grow: 1; overflow-y: auto; padding: 15px; }
        .test-item { border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 15px; overflow: hidden; background: white; }
        .test-header { background: #f8f9fa; padding: 10px 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-weight: bold;}
        .test-body { padding: 15px; }
        
        .input-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        .input-group label { font-size: 0.85rem; font-weight: bold; color: var(--text-muted); display: flex; justify-content: space-between;}
        .range-info { font-weight: normal; font-size: 0.75rem; color: var(--accent-color); background: #eaf4fc; padding: 2px 6px; border-radius: 4px;}
        .input-group input { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; font-family: inherit; outline: none; text-align: center; transition: 0.2s;}
        .input-group input:focus { border-color: var(--accent-color); box-shadow: 0 0 5px rgba(52,152,219,0.3);}
        
        /* الخانات المحسوبة تلقائياً */
        .input-calc { background-color: #f1f3f5; font-weight: bold; color: #495057; cursor: not-allowed; border: 1px dashed #adb5bd !important; }
        
        .btn-save-test { width: 100%; padding: 10px; background: var(--success-color); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: inherit; margin-top: 5px;}
        .empty-msg { text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 1.1rem; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; width: 90%; max-width: 800px; max-height: 95vh; overflow-y: auto; }
        .report-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 20px; }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .report-table th, .report-table td { border: 1px solid #ccc; padding: 10px; text-align: right; font-size: 0.95rem;}
        .report-table th { background: #f8f9fa; }
        .btn-print { background: var(--success-color); color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1rem; margin-top: 20px;}
        .btn-close { background: var(--danger-color); color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px;}
        
        .flag-high { color: red; font-weight: bold; background: #ffebee; padding: 2px 6px; border-radius: 4px;}
        .flag-low { color: blue; font-weight: bold; background: #e3f2fd; padding: 2px 6px; border-radius: 4px;}
        .flag-normal { color: green; font-weight: bold; }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .btn-print, .btn-close { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-info">🔬 المعمل الذكي - معامل طيبة (v19)</div>
        <div>
            <button class="nav-btn print" onclick="openPrintModal()">👁️ معاينة تقرير الزيارة</button>
            <button class="nav-btn" onclick="window.location.href='reception.html'">🏥 الاستقبال</button>
        </div>
    </header>

    <div class="main-grid">
        <div class="panel">
            <div class="panel-header">طابور المرضى</div>
            <div class="patient-list" id="patientList"><div class="empty-msg">جاري التحميل...</div></div>
        </div>
        <div class="panel">
            <div class="panel-header">التحاليل الفردية (Single)</div>
            <div class="tests-list" id="singleList"><div class="empty-msg">اختر مريضاً</div></div>
        </div>
        <div class="panel">
            <div class="panel-header">التحاليل المركبة (Profiles)</div>
            <div class="tests-list" id="profileList"><div class="empty-msg">اختر مريضاً</div></div>
        </div>
    </div>

    <div class="modal" id="printModal">
        <div class="modal-content">
            <div id="print-area">
                <div class="report-header">
                    <h2>معامل طيبة للتحاليل الطبية</h2>
                    <p>تقرير نتائج التحاليل</p>
                    <div id="reportPatientInfo" style="margin-top: 10px; font-weight: bold;"></div>
                </div>
                <table class="report-table">
                    <thead>
                        <tr><th>التحليل / الفحص</th><th>النتيجة</th><th>الوحدة</th><th>المدى المرجعي</th></tr>
                    </thead>
                    <tbody id="reportTableBody"></tbody>
                </table>
            </div>
            <button class="btn-print" onclick="window.print()">🖨️ طباعة الآن</button>
            <button class="btn-close" onclick="closePrintModal()">إغلاق</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://khjzoleiuiipyodpkieg.supabase.co';
        const supabaseKey = 'sb_publishable_2Q7SPvruXJar3gvOxtvl5w_p4CVDfcU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let allVisits = [], visitTests = [], testsCatalog = [], testResults = [];
        let selectedVisitId = null;

        // قيم افتراضية عشان لو السحابة ناقصة
        const fallbackRanges = {
            'Hemoglobin': { male: '13.5 - 17.5', female: '12.0 - 15.5' },
            'HB': { male: '13.5 - 17.5', female: '12.0 - 15.5' },
            'HGB': { male: '13.5 - 17.5', female: '12.0 - 15.5' },
            'RBCs': { male: '4.5 - 5.9', female: '4.1 - 5.1' },
            'RBC': { male: '4.5 - 5.9', female: '4.1 - 5.1' },
            'HCT': { male: '41 - 53', female: '36 - 46' },
            'MCV': { male: '80 - 100', female: '80 - 100' },
            'MCH': { male: '27 - 33', female: '27 - 33' },
            'MCHC': { male: '32 - 36', female: '32 - 36' },
            'WBCs': { male: '4.0 - 11.0', female: '4.0 - 11.0' },
            'WBC': { male: '4.0 - 11.0', female: '4.0 - 11.0' },
            'Platelets': { male: '150 - 450', female: '150 - 450' },
            'PLT': { male: '150 - 450', female: '150 - 450' }
        };

        // دالة لتنظيف الـ ID من المسافات والرموز
        function safeId(name) {
            return name.replace(/[^a-zA-Z0-9]/g, '_');
        }

        async function loadData() {
            const { data: visits } = await _supabase.from('visits').select('*').order('visit_id', { ascending: false });
            const { data: patients } = await _supabase.from('patients').select('*');
            const { data: vt } = await _supabase.from('visit_tests').select('*');
            const { data: catalog } = await _supabase.from('tests_catalog').select('*');
            const { data: results } = await _supabase.from('test_results').select('*');

            testsCatalog = catalog || [];
            visitTests = vt || [];
            testResults = results || [];

            allVisits = (visits || []).map(v => {
                const p = (patients || []).find(x => x.id == v.patient_id) || { name: 'غير معروف', age: 0, gender: 'ذكر' };
                return { ...v, patient: p };
            });
            renderPatients();
        }

        function renderPatients() {
            const list = document.getElementById('patientList');
            if (allVisits.length === 0) return list.innerHTML = '<div class="empty-msg">لا توجد زيارات</div>';

            list.innerHTML = allVisits.map(v => `
                <div class="patient-card ${v.visit_id === selectedVisitId ? 'active' : ''}" onclick="selectPatient(${v.visit_id})">
                    <div class="p-name">${v.patient.name}</div>
                    <div class="p-meta"><span>زيارة #${v.visit_id}</span><span>${v.patient.gender === 'female' || v.patient.gender === 'أنثى' ? 'أنثى' : 'ذكر'} • ${v.patient.age} سنة</span></div>
                </div>
            `).join('');
        }

        function selectPatient(visitId) {
            selectedVisitId = visitId;
            renderPatients();

            const singleList = document.getElementById('singleList');
            const profileList = document.getElementById('profileList');
            const vTests = visitTests.filter(vt => vt.visit_id === visitId);
            
            const patient = allVisits.find(v => v.visit_id === visitId).patient;
            const isFemale = patient.gender === 'female' || patient.gender === 'أنثى';

            if (vTests.length === 0) {
                singleList.innerHTML = '<div class="empty-msg">لا توجد تحاليل</div>';
                profileList.innerHTML = '<div class="empty-msg">لا توجد تحاليل</div>';
                return;
            }

            let singlesHtml = '', profilesHtml = '';

            vTests.forEach(vt => {
                const catalogItem = testsCatalog.find(c => c.code === vt.test_code) || { name: vt.test_code, parameters: [] };
                const result = testResults.find(r => r.visit_test_id === vt.id);
                const savedData = result ? result.results_data : {};
                const isProfile = catalogItem.parameters && catalogItem.parameters.length > 0;

                let inputsHtml = '';

                if (isProfile) {
                    catalogItem.parameters.forEach(param => {
                        const val = savedData[param.name]?.value || '';
                        
                        // تحديد الـ Range
                        let range = isFemale ? (param.ref_female || fallbackRanges[param.name]?.female) : (param.ref_male || fallbackRanges[param.name]?.male);
                        if (!range) range = param.reference_range || '-';
                        
                        const unit = param.unit || param.units || '';
                        
                        // هل البارامتر بيتحسب تلقائي؟
                        const isCalc = ['HCT', 'MCV', 'MCH', 'MCHC', 'INR', 'Ratio'].includes(param.name) || param.is_calc === true;
                        const readonly = isCalc ? 'readonly' : '';
                        const calcClass = isCalc ? 'input-calc' : '';
                        const placeholder = isCalc ? 'تلقائي' : '...';
                        const pId = safeId(param.name);

                        // تم إضافة oninput هنا لربط الحساب اللحظي
                        inputsHtml += `
                            <div class="input-group">
                                <label><span>${param.label || param.name}</span><span class="range-info">${range} ${unit}</span></label>
                                <input type="number" step="any" class="${calcClass}" id="res_${vt.id}_${pId}" value="${val}" placeholder="${placeholder}" ${readonly} oninput="liveCalculate(${vt.id}, '${vt.test_code}')">
                            </div>
                        `;
                    });
                } else {
                    const val = savedData['result']?.value || '';
                    const unit = catalogItem.unit || '';
                    const range = catalogItem.reference_range || '';
                    inputsHtml += `
                        <div class="input-group">
                            <label><span>النتيجة</span><span class="range-info">${range} ${unit}</span></label>
                            <input type="text" id="res_${vt.id}_simple" value="${val}" placeholder="...">
                        </div>
                    `;
                }

                const cardHtml = `
                    <div class="test-item">
                        <div class="test-header"><span>${catalogItem.name}</span><span style="font-size:0.8rem; color:#666;">${vt.test_code}</span></div>
                        <div class="test-body">
                            ${inputsHtml}
                            <button class="btn-save-test" onclick="saveTestResult(${vt.id}, ${isProfile})">💾 حفظ</button>
                        </div>
                    </div>
                `;
                if (isProfile) profilesHtml += cardHtml; else singlesHtml += cardHtml;
            });

            singleList.innerHTML = singlesHtml || '<div class="empty-msg">لا توجد تحاليل فردية</div>';
            profileList.innerHTML = profilesHtml || '<div class="empty-msg">لا توجد تحاليل مركبة</div>';
        }

        // محرك الحسابات اللحظي (Live Calculation Engine)
        function liveCalculate(visitTestId, testCode) {
            const getVal = (names) => {
                for(let n of names) {
                    let el = document.getElementById(`res_${visitTestId}_${safeId(n)}`);
                    if(el && el.value) return parseFloat(el.value);
                }
                return 0;
            }
            
            const setVal = (names, val) => {
                for(let n of names) {
                    let el = document.getElementById(`res_${visitTestId}_${safeId(n)}`);
                    if(el) {
                        el.value = val;
                        break;
                    }
                }
            }

            // 1. حسابات صورة الدم (CBC)
            if(testCode === 'CBC' || testCode === 'TL-035') {
                const hb = getVal(['HB', 'Hemoglobin', 'HGB']);
                const rbc = getVal(['RBCs', 'RBC']);
                
                if(hb > 0) {
                    const hct = hb * 3;
                    setVal(['HCT'], hct.toFixed(1));
                    
                    if(rbc > 0) {
                        const mcv = (hct * 10) / rbc;
                        const mch = (hb * 10) / rbc;
                        const mchc = (hb * 100) / hct;
                        
                        setVal(['MCV'], mcv.toFixed(1));
                        setVal(['MCH'], mch.toFixed(1));
                        setVal(['MCHC'], mchc.toFixed(1));
                    }
                }
            }

            // 2. حسابات السيولة (PT / INR)
            if(testCode === 'PT' || testCode === 'TL-068') {
                const ptPat = getVal(['PT Patient', 'PT_PAT']);
                const ptCon = getVal(['PT Control', 'PT_CON']) || 12.8; 
                if(ptPat > 0) {
                    const ratio = ptPat / ptCon;
                    const inr = Math.pow(ratio, 1.0);
                    setVal(['PT Ratio', 'PT_RAT'], ratio.toFixed(2));
                    setVal(['INR', 'PT_INR'], inr.toFixed(2));
                }
            }
        }

        async function saveTestResult(visitTestId, isProfile) {
            const vt = visitTests.find(v => v.id === visitTestId);
            const catalogItem = testsCatalog.find(c => c.code === vt.test_code);
            let resultsData = {};

            if (isProfile) {
                catalogItem.parameters.forEach(param => {
                    const input = document.getElementById(`res_${visitTestId}_${safeId(param.name)}`);
                    if (input && input.value.trim() !== '') resultsData[param.name] = { value: input.value.trim() };
                });
            } else {
                const input = document.getElementById(`res_${visitTestId}_simple`);
                if (input && input.value.trim() !== '') resultsData['result'] = { value: input.value.trim() };
            }

            if (Object.keys(resultsData).length === 0) return alert('لم يتم إدخال أي نتائج!');

            const { error } = await _supabase.from('test_results').upsert({
                visit_test_id: visitTestId,
                results_data: resultsData
            }, { onConflict: 'visit_test_id' });

            if (error) return alert('خطأ: ' + error.message);
            
            const existingIndex = testResults.findIndex(r => r.visit_test_id === visitTestId);
            if (existingIndex > -1) testResults[existingIndex].results_data = resultsData;
            else testResults.push({ visit_test_id: visitTestId, results_data: resultsData });

            alert('تم الحفظ بنجاح ✅');
        }

        function calcFlag(val, range) {
            if (!val || !range || range === '-') return '';
            const num = parseFloat(val);
            if (isNaN(num)) return '';
            const match = range.match(/([\d.]+)\s*[-–]\s*([\d.]+)/);
            if (match) {
                const min = parseFloat(match[1]), max = parseFloat(match[2]);
                if (num < min) return '<span class="flag-low">L</span>';
                if (num > max) return '<span class="flag-high">H</span>';
            }
            return '<span class="flag-normal">N</span>';
        }

        function openPrintModal() {
            if (!selectedVisitId) return alert('اختر مريضاً أولاً!');
            const visit = allVisits.find(v => v.visit_id === selectedVisitId);
            const vTests = visitTests.filter(vt => vt.visit_id === selectedVisitId);
            const isFemale = visit.patient.gender === 'female' || visit.patient.gender === 'أنثى';

            document.getElementById('reportPatientInfo').innerHTML = `
                اسم المريض: ${visit.patient.name} | العمر: ${visit.patient.age} | النوع: ${isFemale ? 'أنثى' : 'ذكر'}<br>
                رقم الزيارة: ${visit.visit_id} | التاريخ: ${new Date(visit.visit_date || Date.now()).toLocaleDateString('ar-EG')}
            `;

            const tbody = document.getElementById('reportTableBody');
            let rows = '';
            let hasResults = false;

            vTests.forEach(vt => {
                const catalogItem = testsCatalog.find(c => c.code === vt.test_code) || { name: vt.test_code, parameters: [] };
                const result = testResults.find(r => r.visit_test_id === vt.id);
                const savedData = result ? result.results_data : {};
                const isProfile = catalogItem.parameters && catalogItem.parameters.length > 0;

                if (isProfile) {
                    catalogItem.parameters.forEach(param => {
                        const val = savedData[param.name]?.value;
                        if (val) {
                            hasResults = true;
                            let range = isFemale ? (param.ref_female || fallbackRanges[param.name]?.female) : (param.ref_male || fallbackRanges[param.name]?.male);
                            if (!range) range = param.reference_range || '-';
                            const unit = param.unit || param.units || '-';
                            const flag = calcFlag(val, range);
                            rows += `<tr><td>${param.label || param.name}</td><td>${val} ${flag}</td><td>${unit}</td><td>${range}</td></tr>`;
                        }
                    });
                } else {
                    const val = savedData['result']?.value;
                    if (val) {
                        hasResults = true;
                        const range = catalogItem.reference_range || '-';
                        const unit = catalogItem.unit || '-';
                        const flag = calcFlag(val, range);
                        rows += `<tr><td>${catalogItem.name}</td><td>${val} ${flag}</td><td>${unit}</td><td>${range}</td></tr>`;
                    }
                }
            });

            if (!hasResults) rows = '<tr><td colspan="4" style="text-align:center;">لا توجد نتائج مسجلة</td></tr>';

            tbody.innerHTML = rows;
            document.getElementById('printModal').style.display = 'flex';
        }

        function closePrintModal() { document.getElementById('printModal').style.display = 'none'; }

        window.onload = loadData;
    </script>
</body>
</html>
