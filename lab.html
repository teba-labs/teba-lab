<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معامل طيبة - بوابة المعمل (v14)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-bg: #f4f7f6; --surface-bg: #ffffff; --primary-color: #2c3e50;
            --accent-color: #3498db; --success-color: #2ecc71; --danger-color: #e74c3c;
            --warning-color: #f39c12; --text-main: #333; --text-muted: #7f8c8d; 
            --border-color: #dcdde1; --shadow-sm: 0 2px 5px rgba(0,0,0,0.05);
            --shadow-md: 0 5px 15px rgba(0,0,0,0.08); --radius: 8px; 
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-family); background-color: var(--primary-bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header { background-color: var(--primary-color); color: white; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; box-shadow: var(--shadow-md); z-index: 10; }
        .brand-info { font-weight: bold; font-size: 1.1rem; }
        .nav-btn { background: var(--accent-color); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: inherit;}

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; width: 100%; flex-grow: 1; }
        .toolbar { background: var(--surface-bg); border-radius: var(--radius); padding: 15px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; box-shadow: var(--shadow-sm); }
        
        .search-box input { width: 100%; padding: 10px 15px; border: 2px solid var(--border-color); border-radius: var(--radius); outline: none; font-family: inherit;}
        .tabs { display: flex; gap: 5px; background: #eee; padding: 4px; border-radius: var(--radius); }
        .tab { padding: 8px 16px; border: none; background: transparent; cursor: pointer; font-weight: bold; border-radius: 5px; font-family: inherit;}
        .tab.active { background: var(--surface-bg); color: var(--primary-color); box-shadow: var(--shadow-sm); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .card { background: var(--surface-bg); border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .card.pending { border-top: 4px solid var(--warning-color); }
        .card.done { border-top: 4px solid var(--success-color); }
        .card-header { padding: 12px 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; }
        .p-name { font-weight: bold; color: var(--primary-color); }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge.pending { background: #ffeaa7; color: #d35400; }
        .badge.done { background: #d4edda; color: #27ae60; }
        
        .card-body { padding: 15px; flex-grow: 1; }
        .test-info { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold;}
        .card-footer { padding: 12px 15px; border-top: 1px solid var(--border-color); background: #fafafa; display: flex; justify-content: space-between; align-items: center;}
        
        .btn { padding: 8px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; font-family: inherit;}
        .btn-primary { background: var(--accent-color); }
        .btn-success { background: var(--success-color); }
        .btn-print { background: var(--primary-color); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: var(--radius); width: 95%; max-width: 800px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;}
        
        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .data-table th, .data-table td { padding: 8px; border: 1px solid var(--border-color); text-align: right; font-size: 0.9rem;}
        .data-table th { background: #f8f9fa; }
        
        .res-input { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 1rem; font-weight: bold; text-align: center;}
        .res-input:focus { border-color: var(--accent-color); outline: none;}
        
        .flag-high { color: var(--danger-color); font-weight: bold; }
        .flag-low { color: var(--accent-color); font-weight: bold; }
        .flag-normal { color: var(--success-color); font-weight: bold; }
        
        .empty-msg { text-align: center; padding: 50px; color: var(--text-muted); }

        /* إعدادات الطباعة */
        @media print {
            body * { visibility: hidden; }
            #resultModal, #resultModal * { visibility: visible; }
            #resultModal { position: absolute; left: 0; top: 0; width: 100%; background: white; display: block !important; }
            .modal-content { box-shadow: none; max-height: none; width: 100%; max-width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-info">🔬 المعمل - معامل طيبة (v14)</div>
        <button class="nav-btn no-print" onclick="window.location.href='reception.html'">🏥 الاستقبال</button>
    </header>

    <div class="container">
        <div class="toolbar no-print">
            <div class="tabs">
                <button class="tab active" onclick="setFilter('all')" id="tab-all">الكل</button>
                <button class="tab" onclick="setFilter('pending')" id="tab-pending">مطلوب</button>
                <button class="tab" onclick="setFilter('done')" id="tab-done">تم الانتهاء</button>
            </div>
            <div class="search-box" style="flex-grow:1;">
                <input type="text" id="searchInput" placeholder="بحث..." onkeyup="renderData()">
            </div>
        </div>

        <div class="grid" id="labGrid"></div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <div class="modal-header no-print">
                <h3 id="modalTitle">إدخال نتيجة</h3>
                <button class="btn" style="background:#e74c3c;" onclick="closeModal()">X</button>
            </div>
            <div id="modalPatientInfo" style="background: #f0f4f8; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 1.1rem;"></div>
            
            <div id="dynamicFormArea"></div>

            <div style="display: flex; gap: 10px; margin-top: 15px;" class="no-print">
                <button class="btn btn-success" onclick="saveResult()" id="saveResBtn" style="flex: 1; padding: 12px; font-size: 1.1rem;">💾 حفظ النتائج</button>
                <button class="btn btn-print" onclick="window.print()" style="flex: 1; padding: 12px; font-size: 1.1rem;">🖨️ طباعة النتيجة</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://khjzoleiuiipyodpkieg.supabase.co';
        const supabaseKey = 'sb_publishable_2Q7SPvruXJar3gvOxtvl5w_p4CVDfcU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let allData = [], currentFilter = 'all', currentRow = null;

        async function loadLabData() {
            const { data: vtData, error } = await _supabase.from('visit_tests').select('*').order('id', { ascending: false });
            if (error) return document.getElementById('labGrid').innerHTML = `<div class="empty-msg" style="color:red;">خطأ: ${error.message}</div>`;

            const { data: visits } = await _supabase.from('visits').select('*');
            const { data: patients } = await _supabase.from('patients').select('*');
            const { data: catalog } = await _supabase.from('tests_catalog').select('*');
            const { data: results } = await _supabase.from('test_results').select('*');

            allData = vtData.map(vt => {
                const visit = visits?.find(v => v.visit_id == vt.visit_id || v.id == vt.visit_id) || {};
                const patient = patients?.find(p => p.id == visit.patient_id || p.patient_id == visit.patient_id) || {};
                const test = catalog?.find(c => c.code === vt.test_code) || { name: vt.test_code, parameters: [] };
                const result = results?.find(r => r.visit_test_id === vt.id) || null;

                return { ...vt, patient, test_name: test.name, parameters: test.parameters, result };
            });

            renderData();
        }

        function renderData() {
            const grid = document.getElementById('labGrid');
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allData.filter(item => {
                const p = item.patient || {};
                const pName = (p.full_name || p.name || '').toLowerCase();
                const matchSearch = pName.includes(query) || (item.test_code || '').toLowerCase().includes(query);
                
                const isDone = item.result !== null;
                let matchFilter = true;
                if (currentFilter === 'pending') matchFilter = !isDone;
                if (currentFilter === 'done') matchFilter = isDone;

                return matchSearch && matchFilter;
            });

            if (!filtered.length) return grid.innerHTML = '<div class="empty-msg">لا توجد طلبات</div>';

            grid.innerHTML = filtered.map(item => {
                const p = item.patient || {};
                const isDone = item.result !== null;
                const statusClass = isDone ? 'done' : 'pending';
                const pName = p.full_name || p.name || 'غير معروف';
                
                return `
                    <div class="card ${statusClass}">
                        <div class="card-header">
                            <div><div class="p-name">${pName}</div><div style="font-size:0.8rem; color:#666;">${p.gender === 'female' || p.gender === 'أنثى' ? 'أنثى' : 'ذكر'} • ${p.age || '?'} سنة</div></div>
                            <span class="badge ${statusClass}">${isDone ? 'تم' : 'مطلوب'}</span>
                        </div>
                        <div class="card-body">
                            <div class="test-info"><span>${item.test_name}</span> <span>${item.test_code}</span></div>
                            ${isDone ? `<div style="text-align:center; font-size:1.5rem; color:var(--success-color);">✅ تم إدخال النتائج</div>` : ''}
                        </div>
                        <div class="card-footer">
                            <span>زيارة #${item.visit_id}</span>
                            <button class="btn ${isDone ? 'btn-primary' : 'btn-success'}" onclick='openModal(${JSON.stringify(item)})'>
                                ${isDone ? '✏️ تعديل' : '➕ إدخال'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setFilter(type) {
            currentFilter = type;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + type).classList.add('active');
            renderData();
        }

        function calcFlag(val, ref) {
            if (!val || !ref) return 'normal';
            const num = parseFloat(val);
            if (isNaN(num)) return 'normal';
            const range = ref.match(/([\d.]+)\s*[-–]\s*([\d.]+)/);
            if (range) {
                const min = parseFloat(range[1]), max = parseFloat(range[2]);
                if (num < min) return 'low';
                if (num > max) return 'high';
            }
            return 'normal';
        }

        function openModal(item) {
            currentRow = item;
            const p = item.patient || {};
            document.getElementById('modalPatientInfo').innerHTML = `
                <strong>المريض:</strong> ${p.full_name || p.name || 'غير معروف'} (${p.gender === 'female' || p.gender === 'أنثى' ? 'أنثى' : 'ذكر'}) <br>
                <strong>التحليل:</strong> ${item.test_name} (${item.test_code})
            `;

            const params = item.parameters || [];
            const savedData = item.result?.results_data || {};
            let html = '';

            if (params.length > 0) {
                html += `<table class="data-table">
                    <thead><tr><th>الفحص</th><th>النتيجة</th><th>الوحدة</th><th>المدى المرجعي</th><th>الحالة</th></tr></thead>
                    <tbody>`;
                
                params.forEach((param, index) => {
                    const ref = p.gender === 'female' || p.gender === 'أنثى' ? param.ref_female : param.ref_male;
                    const savedVal = savedData[param.name]?.value || '';
                    const savedFlag = savedData[param.name]?.flag || 'normal';
                    const flagText = savedFlag === 'high' ? 'H' : savedFlag === 'low' ? 'L' : 'N';

                    html += `<tr>
                        <td><strong>${param.label}</strong><br><small style="color:#777">${param.name}</small></td>
                        <td><input type="text" class="res-input" id="val_${param.name}" value="${savedVal}" 
                            oninput="updateRowFlag('${param.name}', '${ref}')"
                            onkeydown="handleEnter(event, ${index}, ${params.length})"></td>
                        <td>${param.unit}</td>
                        <td>${ref}</td>
                        <td id="flag_${param.name}" class="flag-${savedFlag}">${flagText}</td>
                    </tr>`;
                });
                html += `</tbody></table>`;
            } else {
                const val = savedData['result']?.value || '';
                const flag = savedData['result']?.flag || 'normal';
                html += `<div style="display: flex; flex-direction: column; gap: 15px;">
                    <div>
                        <label style="font-weight:bold; display:block; margin-bottom:5px;">النتيجة:</label>
                        <input type="text" class="res-input" id="val_simple" value="${val}" style="text-align:right; padding:10px; font-size: 1.5rem;"
                        onkeydown="if(event.key === 'Enter') { event.preventDefault(); saveResult(); }">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <div style="flex:1;">
                            <label style="font-weight:bold; display:block; margin-bottom:5px;">التقييم:</label>
                            <select id="flag_simple" style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc; font-family:inherit;">
                                <option value="normal" ${flag === 'normal' ? 'selected' : ''}>طبيعي (Normal)</option>
                                <option value="high" ${flag === 'high' ? 'selected' : ''}>مرتفع (High)</option>
                                <option value="low" ${flag === 'low' ? 'selected' : ''}>منخفض (Low)</option>
                            </select>
                        </div>
                    </div>
                </div>`;
            }

            document.getElementById('dynamicFormArea').innerHTML = html;
            document.getElementById('resultModal').style.display = 'flex';
            
            setTimeout(() => {
                const firstInput = document.querySelector('.res-input');
                if(firstInput) firstInput.focus();
            }, 100);
        }

        function handleEnter(event, index, total) {
            if (event.key === 'Enter') {
                event.preventDefault();
                if (index < total - 1) {
                    const nextInput = document.querySelectorAll('.res-input')[index + 1];
                    if (nextInput) nextInput.focus();
                } else {
                    saveResult();
                }
            }
        }

        window.updateRowFlag = function(paramName, refRange) {
            const val = document.getElementById(`val_${paramName}`).value;
            const flag = calcFlag(val, refRange);
            const cell = document.getElementById(`flag_${paramName}`);
            cell.className = `flag-${flag}`;
            cell.innerText = flag === 'high' ? 'H' : flag === 'low' ? 'L' : 'N';
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
            currentRow = null;
        }

        async function saveResult() {
            if(!currentRow) return;
            const params = currentRow.parameters || [];
            const resultsData = {};
            const p = currentRow.patient || {};

            if (params.length > 0) {
                for (let param of params) {
                    const val = document.getElementById(`val_${param.name}`).value.trim();
                    if (!val) return alert(`الرجاء إدخال نتيجة ${param.label}`);
                    
                    const ref = p.gender === 'female' || p.gender === 'أنثى' ? param.ref_female : param.ref_male;
                    const flag = calcFlag(val, ref);
                    
                    resultsData[param.name] = { value: val, flag: flag };
                }
            } else {
                const val = document.getElementById('val_simple').value.trim();
                if (!val) return alert('الرجاء إدخال النتيجة');
                const flag = document.getElementById('flag_simple').value;
                resultsData['result'] = { value: val, flag: flag };
            }

            const btn = document.getElementById('saveResBtn');
            btn.innerText = 'جاري الحفظ...'; btn.disabled = true;

            try {
                const { error } = await _supabase.from('test_results').upsert({
                    visit_test_id: currentRow.id,
                    results_data: resultsData
                }, { onConflict: 'visit_test_id' });

                if(error) throw error;
                alert('تم الحفظ بنجاح!');
                closeModal();
                loadLabData();
            } catch(err) {
                alert('خطأ: ' + err.message);
            } finally {
                btn.innerText = '💾 حفظ النتائج'; btn.disabled = false;
            }
        }

        window.onload = loadLabData;
    </script>
</body>
</html>
