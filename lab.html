<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معامل طيبة - محطة العمل (v15)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-bg: #f4f7f6; --surface-bg: #ffffff; --primary-color: #2c3e50;
            --accent-color: #3498db; --success-color: #2ecc71; --danger-color: #e74c3c;
            --warning-color: #f39c12; --text-main: #333; --text-muted: #7f8c8d; 
            --border-color: #dcdde1; --shadow-sm: 0 2px 5px rgba(0,0,0,0.05);
            --shadow-md: 0 5px 15px rgba(0,0,0,0.08); --radius: 8px; 
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-family); background-color: var(--primary-bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header */
        header { background-color: var(--primary-color); color: white; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; box-shadow: var(--shadow-md); z-index: 10; }
        .brand-info { font-weight: bold; font-size: 1.1rem; }
        .header-btns { display: flex; gap: 10px; }
        .nav-btn { background: var(--accent-color); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 0.95rem;}
        .btn-print { background: var(--success-color); }
        
        /* Layout */
        .main-container { display: grid; grid-template-columns: 300px 1fr 1fr; gap: 15px; padding: 15px; flex-grow: 1; height: calc(100vh - 60px); }
        .panel { background: var(--surface-bg); border-radius: var(--radius); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; border: 1px solid var(--border-color); overflow: hidden; }
        .panel-header { background: #f8f9fa; padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-weight: bold; color: var(--primary-color); font-size: 1.1rem;}

        /* Right Column: Patients */
        .patient-list { overflow-y: auto; flex-grow: 1; }
        .patient-item { padding: 12px 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; }
        .patient-item:hover { background: #f1f8ff; }
        .patient-item.active { background: #e3f2fd; border-right: 4px solid var(--accent-color); }
        .p-name { font-weight: bold; font-size: 1rem; color: var(--primary-color); margin-bottom: 4px; }
        .p-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between;}

        /* Middle & Left Columns: Tests */
        .test-list { padding: 15px; overflow-y: auto; flex-grow: 1; }
        .empty-msg { text-align: center; color: var(--text-muted); margin-top: 50px; }

        /* Single Test Box */
        .single-test-box { background: #fafafa; border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; margin-bottom: 15px; }
        .test-title { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; color: var(--primary-color);}
        .input-group { display: flex; gap: 10px; align-items: center; }
        .input-group input { flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 1rem;}
        .btn-save-small { background: var(--success-color); color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: inherit;}
        
        /* Profile Accordion */
        .profile-box { border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 15px; overflow: hidden; }
        .profile-header { background: #f8f9fa; padding: 12px 15px; cursor: pointer; display: flex; justify-content: space-between; font-weight: bold; color: var(--primary-color); transition: 0.2s;}
        .profile-header:hover { background: #eee; }
        .profile-content { display: none; padding: 15px; background: #fff; border-top: 1px solid var(--border-color); }
        .profile-content.open { display: block; }
        
        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        .data-table th, .data-table td { padding: 6px; border-bottom: 1px solid #eee; text-align: right; font-size: 0.9rem; }
        .data-table input { width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        .flag-text { font-weight: bold; font-size: 0.85rem;}
        .flag-high { color: var(--danger-color); }
        .flag-low { color: var(--accent-color); }
        .flag-normal { color: var(--success-color); }

        /* Modal Preview */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: var(--radius); width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; }
        .print-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 20px; }
        .print-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .print-table th, .print-table td { border: 1px solid #000; padding: 8px; text-align: right; }
        
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .modal { position: absolute; background: white; display: block !important; }
            .modal-content { box-shadow: none; max-height: none; width: 100%; padding: 0;}
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-info">🔬 محطة عمل المعمل (v15)</div>
        <div class="header-btns">
            <button class="nav-btn btn-print" onclick="openPrintPreview()">🖨️ معاينة وطباعة النتائج</button>
            <button class="nav-btn" onclick="window.location.href='reception.html'">🏥 الاستقبال</button>
        </div>
    </header>

    <div class="main-container">
        <!-- المرضى -->
        <div class="panel">
            <div class="panel-header">المرضى (الطابور)</div>
            <div class="patient-list" id="patientList"></div>
        </div>

        <!-- التحاليل الفردية -->
        <div class="panel">
            <div class="panel-header">التحاليل الفردية (Single)</div>
            <div class="test-list" id="singleTests"></div>
        </div>

        <!-- التحاليل المركبة -->
        <div class="panel">
            <div class="panel-header">التحاليل المركبة (Profiles)</div>
            <div class="test-list" id="profileTests"></div>
        </div>
    </div>

    <!-- Modal للطباعة -->
    <div class="modal" id="printModal">
        <div class="modal-content" id="print-area">
            <div class="print-header">
                <h2>معامل طيبة للتحاليل الطبية</h2>
                <p>تقرير نتائج التحاليل</p>
                <div id="printPatientInfo" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
            <div id="printResultsBody"></div>
            <div class="no-print" style="text-align: center; margin-top: 20px;">
                <button class="nav-btn btn-print" onclick="window.print()" style="padding: 10px 30px; font-size: 1.1rem;">🖨️ طباعة الآن</button>
                <button class="nav-btn" onclick="document.getElementById('printModal').style.display='none'" style="background: #7f8c8d;">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://khjzoleiuiipyodpkieg.supabase.co';
        const supabaseKey = 'sb_publishable_2Q7SPvruXJar3gvOxtvl5w_p4CVDfcU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let allVisits = [], allPatients = [], allCatalog = [], allVisitTests = [], allResults = [];
        let currentVisitId = null, currentPatient = null;

        async function loadData() {
            // جلب البيانات
            const { data: visits } = await _supabase.from('visits').select('*').order('visit_id', { ascending: false });
            const { data: patients } = await _supabase.from('patients').select('*');
            const { data: catalog } = await _supabase.from('tests_catalog').select('*');
            const { data: vt } = await _supabase.from('visit_tests').select('*');
            const { data: results } = await _supabase.from('test_results').select('*');

            allVisits = visits || [];
            allPatients = patients || [];
            allCatalog = catalog || [];
            allVisitTests = vt || [];
            allResults = results || [];

            renderPatientList();
            
            // اختيار أول مريض أوتوماتيك
            if (allVisits.length > 0) {
                selectPatient(allVisits[0].visit_id);
            } else {
                document.getElementById('patientList').innerHTML = '<div class="empty-msg">لا يوجد مرضى</div>';
            }
        }

        function renderPatientList() {
            const list = document.getElementById('patientList');
            list.innerHTML = allVisits.map(v => {
                const p = allPatients.find(pt => pt.id === v.patient_id) || {};
                const isActive = v.visit_id === currentVisitId ? 'active' : '';
                
                // حساب عدد التحاليل
                const vTests = allVisitTests.filter(t => t.visit_id === v.visit_id);
                const count = vTests.length;

                return `
                    <div class="patient-item ${isActive}" onclick="selectPatient(${v.visit_id})">
                        <div class="p-name">${p.name || 'غير معروف'}</div>
                        <div class="p-meta">
                            <span>زيارة #${v.visit_id}</span>
                            <span>عدد التحاليل: ${count}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectPatient(visitId) {
            currentVisitId = visitId;
            const visit = allVisits.find(v => v.visit_id === visitId);
            currentPatient = allPatients.find(p => p.id === visit.patient_id) || {};

            renderPatientList(); // عشان نلون المريض المختار
            renderTests();
        }

        function renderTests() {
            const singleDiv = document.getElementById('singleTests');
            const profileDiv = document.getElementById('profileTests');
            
            // جلب تحاليل المريض الحالي
            const vTests = allVisitTests.filter(t => t.visit_id === currentVisitId);
            
            let singleHtml = '', profileHtml = '';

            if (vTests.length === 0) {
                singleDiv.innerHTML = '<div class="empty-msg">لا توجد تحاليل</div>';
                profileDiv.innerHTML = '<div class="empty-msg">لا توجد تحاليل</div>';
                return;
            }

            vTests.forEach(vt => {
                const test = allCatalog.find(c => c.code === vt.test_code) || { name: vt.test_code, parameters: [] };
                const result = allResults.find(r => r.visit_test_id === vt.id);
                
                let params = test.parameters;
                if (typeof params === 'string') {
                    try { params = JSON.parse(params); } catch(e) { params = []; }
                }
                if (!Array.isArray(params)) params = [];

                // تحليل فردي
                if (params.length === 0) {
                    const savedVal = result && result.results_data && result.results_data['result'] ? result.results_data['result'].value : '';
                    singleHtml += `
                        <div class="single-test-box">
                            <div class="test-title">
                                <span>${test.name} (${vt.test_code})</span>
                            </div>
                            <div class="input-group">
                                <input type="text" id="res_${vt.id}" value="${savedVal}" placeholder="النتيجة...">
                                <button class="btn-save-small" onclick="saveSingle(${vt.id})">💾 حفظ</button>
                            </div>
                        </div>
                    `;
                } 
                // تحليل مركب
                else {
                    const savedData = (result && result.results_data) ? result.results_data : {};
                    let tableRows = '';
                    
                    params.forEach(param => {
                        const pName = param.name;
                        const ref = currentPatient.gender === 'female' || currentPatient.gender === 'أنثى' ? param.ref_female : param.ref_male;
                        const savedVal = savedData[pName] ? savedData[pName].value : '';
                        const savedFlag = savedData[pName] ? savedData[pName].flag : 'normal';
                        const flagText = savedFlag === 'high' ? 'H' : savedFlag === 'low' ? 'L' : 'N';

                        tableRows += `
                            <tr>
                                <td>${param.label || pName}</td>
                                <td><input type="text" id="p_${vt.id}_${pName}" value="${savedVal}" oninput="calcFlag('${vt.id}', '${pName}', '${ref}')"></td>
                                <td>${param.unit || ''}</td>
                                <td style="font-size:0.8rem;">${ref || ''}</td>
                                <td class="flag-text flag-${savedFlag}" id="flag_${vt.id}_${pName}">${flagText}</td>
                            </tr>
                        `;
                    });

                    profileHtml += `
                        <div class="profile-box">
                            <div class="profile-header" onclick="toggleAccordion('acc_${vt.id}')">
                                <span>${test.name} (${vt.test_code})</span>
                                <span>▼</span>
                            </div>
                            <div class="profile-content" id="acc_${vt.id}">
                                <table class="data-table">
                                    <thead><tr><th>الفحص</th><th>النتيجة</th><th>الوحدة</th><th>المرجع</th><th>الحالة</th></tr></thead>
                                    <tbody>${tableRows}</tbody>
                                </table>
                                <button class="btn-save-small" style="width:100%;" onclick="saveProfile(${vt.id})">💾 حفظ نتائج ${test.name}</button>
                            </div>
                        </div>
                    `;
                }
            });

            singleDiv.innerHTML = singleHtml || '<div class="empty-msg">لا توجد تحاليل فردية</div>';
            profileDiv.innerHTML = profileHtml || '<div class="empty-msg">لا توجد تحاليل مركبة</div>';
        }

        function toggleAccordion(id) {
            const el = document.getElementById(id);
            if (el.classList.contains('open')) {
                el.classList.remove('open');
            } else {
                el.classList.add('open');
            }
        }

        // حساب التقييم (H/L)
        function calcFlag(vtId, pName, ref) {
            const val = document.getElementById(`p_${vtId}_${pName}`).value;
            const flagEl = document.getElementById(`flag_${vtId}_${pName}`);
            
            let flag = 'normal';
            const num = parseFloat(val);
            if (!isNaN(num) && ref) {
                const range = ref.match(/([\d.]+)\s*[-–]\s*([\d.]+)/);
                if (range) {
                    const min = parseFloat(range[1]), max = parseFloat(range[2]);
                    if (num < min) flag = 'low';
                    if (num > max) flag = 'high';
                }
            }
            
            flagEl.className = `flag-text flag-${flag}`;
            flagEl.innerText = flag === 'high' ? 'H' : flag === 'low' ? 'L' : 'N';
        }

        // الحفظ للتحاليل الفردية
        async function saveSingle(vtId) {
            const val = document.getElementById(`res_${vtId}`).value.trim();
            if (!val) return alert('أدخل النتيجة أولاً');
            
            const payload = {
                visit_test_id: vtId,
                results_data: { 'result': { value: val, flag: 'normal' } }
            };

            const { error } = await _supabase.from('test_results').upsert(payload, { onConflict: 'visit_test_id' });
            if (error) return alert('خطأ: ' + error.message);
            
            alert('✅ تم الحفظ');
            await loadData(); // تحديث
        }

        // الحفظ للتحاليل المركبة
        async function saveProfile(vtId) {
            const test = allCatalog.find(c => c.code === allVisitTests.find(vt => vt.id === vtId).test_code);
            let params = test.parameters;
            if (typeof params === 'string') { try { params = JSON.parse(params); } catch(e) { params = []; } }
            
            const results_data = {};
            let hasEmpty = false;

            params.forEach(p => {
                const val = document.getElementById(`p_${vtId}_${p.name}`).value.trim();
                if (!val) hasEmpty = true; // ممكن نمنع الحفظ لو فيه خانة فاضية، أو نسمح
                
                const ref = currentPatient.gender === 'female' || currentPatient.gender === 'أنثى' ? p.ref_female : p.ref_male;
                let flag = 'normal';
                const num = parseFloat(val);
                if (!isNaN(num) && ref) {
                    const range = ref.match(/([\d.]+)\s*[-–]\s*([\d.]+)/);
                    if (range) {
                        if (num < parseFloat(range[1])) flag = 'low';
                        if (num > parseFloat(range[2])) flag = 'high';
                    }
                }
                results_data[p.name] = { value: val, flag: flag };
            });

            if (hasEmpty && !confirm('بعض الخانات فارغة، هل تريد الحفظ؟')) return;

            const { error } = await _supabase.from('test_results').upsert({
                visit_test_id: vtId,
                results_data: results_data
            }, { onConflict: 'visit_test_id' });

            if (error) return alert('خطأ: ' + error.message);
            
            alert('✅ تم الحفظ');
            await loadData();
        }

        // معاينة وطباعة النتائج
        function openPrintPreview() {
            if (!currentVisitId) return alert('اختر مريض أولاً');
            
            const visit = allVisits.find(v => v.visit_id === currentVisitId);
            const vTests = allVisitTests.filter(t => t.visit_id === currentVisitId);
            
            document.getElementById('printPatientInfo').innerHTML = `
                اسم المريض: ${currentPatient.name || 'غير معروف'} <br>
                العمر: ${currentPatient.age || ''} - النوع: ${currentPatient.gender === 'female' || currentPatient.gender === 'أنثى' ? 'أنثى' : 'ذكر'} <br>
                زيارة رقم: ${currentVisitId} - التاريخ: ${visit.visit_date || new Date().toLocaleDateString('ar-EG')}
            `;

            let html = '';
            
            vTests.forEach(vt => {
                const test = allCatalog.find(c => c.code === vt.test_code) || { name: vt.test_code, parameters: [] };
                const result = allResults.find(r => r.visit_test_id === vt.id);
                if (!result) return; // لو مفيش نتيجة مسجلة، منعرضهاش

                let params = test.parameters;
                if (typeof params === 'string') { try { params = JSON.parse(params); } catch(e) { params = []; } }
                if (!Array.isArray(params)) params = [];

                html += `<h4 style="margin: 15px 0 5px 0; background: #eee; padding: 5px;">${test.name} (${vt.test_code})</h4>`;
                html += `<table class="print-table"><thead><tr><th>الفحص</th><th>النتيجة</th><th>الوحدة</th><th>المدى المرجعي</th></tr></thead><tbody>`;

                if (params.length === 0) {
                    // تحليل فردي
                    html += `<tr><td>${test.name}</td><td>${result.results_data['result']?.value || '-'}</td><td>-</td><td>-</td></tr>`;
                } else {
                    // تحليل مركب
                    params.forEach(p => {
                        const rData = result.results_data[p.name] || { value: '-', flag: 'normal' };
                        const ref = currentPatient.gender === 'female' || currentPatient.gender === 'أنثى' ? p.ref_female : p.ref_male;
                        const color = rData.flag === 'high' ? 'red' : rData.flag === 'low' ? 'blue' : 'black';
                        
                        html += `<tr>
                            <td>${p.label || p.name}</td>
                            <td style="color:${color}; font-weight:bold;">${rData.value} <span style="font-size:10px">${rData.flag === 'high' ? '(H)' : rData.flag === 'low' ? '(L)' : ''}</span></td>
                            <td>${p.unit || ''}</td>
                            <td>${ref || ''}</td>
                        </tr>`;
                    });
                }
                html += `</tbody></table>`;
            });

            if (!html) return alert('لا توجد نتائج مسجلة لهذا المريض لطباعتها.');

            document.getElementById('printResultsBody').innerHTML = html;
            document.getElementById('printModal').style.display = 'flex';
        }

        window.onload = loadData;
    </script>
</body>
</html>
