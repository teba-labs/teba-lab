<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معامل طيبة - المعمل الذكي (v27 - سريع)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-bg: #f4f7f6; --surface-bg: #ffffff; --primary-color: #2c3e50;
            --accent-color: #3498db; --success-color: #2ecc71; --danger-color: #e74c3c;
            --warning-color: #f39c12; --text-main: #333; --text-muted: #7f8c8d; 
            --border-color: #dcdde1; --radius: 8px; 
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-family); background-color: var(--primary-bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background-color: var(--primary-color); color: white; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 10; }
        .brand-info { font-weight: bold; font-size: 1.2rem; }
        .nav-btn { background: var(--accent-color); color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 1rem;}
        .nav-btn.print { background: var(--warning-color); color: #333; margin-left: 10px;}

        .main-grid { display: grid; grid-template-columns: 300px 1fr 1fr; gap: 15px; padding: 15px; flex-grow: 1; height: calc(100vh - 60px); }
        .panel { background: var(--surface-bg); border-radius: var(--radius); box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; border: 1px solid var(--border-color); overflow: hidden; }
        .panel-header { background: #f8f9fa; padding: 15px; border-bottom: 1px solid var(--border-color); font-weight: bold; color: var(--primary-color); text-align: center; font-size: 1.1rem;}

        .patient-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .patient-card { padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; background: white; }
        .patient-card:hover { border-color: var(--accent-color); background: #f0f8ff; }
        .patient-card.active { border-color: var(--accent-color); background: #e1f0fa; border-right: 4px solid var(--accent-color); }
        .p-name { font-weight: bold; margin-bottom: 5px; color: var(--primary-color);}
        .p-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between;}

        .tests-list { flex-grow: 1; overflow-y: auto; padding: 15px; }
        .test-item { border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 15px; overflow: hidden; background: white; }
        .test-header { background: #f8f9fa; padding: 10px 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-weight: bold;}
        .test-body { padding: 15px; }
        
        .input-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        .input-group label { font-size: 0.85rem; font-weight: bold; color: var(--text-muted); display: flex; justify-content: space-between;}
        .range-info { font-weight: normal; font-size: 0.75rem; color: var(--accent-color); background: #eaf4fc; padding: 2px 6px; border-radius: 4px;}
        .input-group input { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; font-family: inherit; outline: none; text-align: center; font-weight: bold;}
        .input-group input:focus { border-color: var(--accent-color); box-shadow: 0 0 5px rgba(52,152,219,0.3); }
        .input-calc { background-color: #f0f8ff; color: #0056b3; border-color: #b3d7ff;}
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-save-test { flex-grow: 1; padding: 10px; background: var(--success-color); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: inherit;}
        .btn-del-test { background: var(--danger-color); color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: inherit;}
        
        .empty-msg { text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 1.1rem; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--success-color); color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: none; z-index: 1000; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 95%; max-width: 900px; max-height: 95vh; overflow-y: auto; }
        
        .btn-print { background: var(--success-color); color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1rem; margin-top: 15px; }
        .btn-close { background: var(--danger-color); color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1rem; margin-top: 10px; }

        .print-page { background: #fff; width: 100%; min-height: 297mm; padding: 15mm; margin-bottom: 20px; box-sizing: border-box; position: relative; border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .print-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; z-index: 2; position: relative; }
        .print-footer { position: absolute; bottom: 15mm; left: 15mm; right: 15mm; border-top: 2px solid #000; padding-top: 10px; font-size: 12px; display: flex; justify-content: space-between; }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 0; margin: 0;}
            .modal { position: absolute; background: transparent; display: block !important; }
            .modal-content { box-shadow: none; padding: 0; border: none; max-height: none; overflow: visible; }
            .btn-print, .btn-close { display: none !important; }
            .print-page { border: none; box-shadow: none; margin: 0; page-break-after: always; }
            @page { size: A4; margin: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-info">🔬 المعمل - معامل طيبة (v27)</div>
        <div>
            <button class="nav-btn print" onclick="openPrintModal()">👁️ معاينة تقرير الزيارة</button>
            <button class="nav-btn" onclick="window.location.href='reception.html'">🏥 الاستقبال</button>
        </div>
    </header>

    <div id="toast">✅ تم الحفظ</div>

    <div class="main-grid">
        <div class="panel">
            <div class="panel-header">طابور المرضى (آخر 100 زيارة)</div>
            <div class="patient-list" id="patientList"><div class="empty-msg">جاري التحميل...</div></div>
        </div>
        <div class="panel">
            <div class="panel-header">التحاليل الفردية (Single)</div>
            <div class="tests-list" id="singleList"><div class="empty-msg">اختر مريضاً</div></div>
        </div>
        <div class="panel">
            <div class="panel-header">التحاليل المركبة (Profiles)</div>
            <div class="tests-list" id="profileList"><div class="empty-msg">اختر مريضاً</div></div>
        </div>
    </div>

    <div class="modal" id="printModal">
        <div class="modal-content" style="background: #e0e0e0;">
            <div id="print-area" style="direction: ltr; text-align: left; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #000;"></div>
            <button class="btn-print" onclick="window.print()">🖨️ Print Now</button>
            <button class="btn-close" onclick="closePrintModal()">Close</button>
        </div>
    </div>

    <script>
        document.addEventListener("wheel", function(event){
            if(document.activeElement.type === "number" || document.activeElement.type === "text"){
                document.activeElement.blur();
            }
        });

        const supabaseUrl = 'https://khjzoleiuiipyodpkieg.supabase.co';
        const supabaseKey = 'sb_publishable_2Q7SPvruXJar3gvOxtvl5w_p4CVDfcU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let allVisits = [], visitTests = [], testsCatalog = [], testResults = [];
        let selectedVisitId = null;

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        // الدالة السحرية للسرعة: بتجيب آخر 100 زيارة بس وتربطهم ببعض
        async function loadData() {
            // 1. هات آخر 100 زيارة
            const { data: visits } = await _supabase.from('visits').select('*').order('visit_id', { ascending: false }).limit(100);
            if (!visits || visits.length === 0) return renderPatients();

            const visitIds = visits.map(v => v.visit_id);
            const patientIds = [...new Set(visits.map(v => v.patient_id))]; // عشان نمنع التكرار

            // 2. هات المرضى بتوع الزيارات دي بس
            const { data: patients } = await _supabase.from('patients').select('*').in('id', patientIds);
            
            // 3. هات التحاليل والنتايج بتاعة الزيارات دي بس
            const { data: vt } = await _supabase.from('visit_tests').select('*').in('visit_id', visitIds);
            const vtIds = vt ? vt.map(v => v.id) : [];
            
            let results = [];
            if (vtIds.length > 0) {
                const { data: res } = await _supabase.from('test_results').select('*').in('visit_test_id', vtIds);
                results = res || [];
            }

            // 4. هات الكتالوج
            const { data: catalog } = await _supabase.from('tests_catalog').select('*');

            testsCatalog = catalog || [];
            visitTests = vt || [];
            testResults = results || [];

            allVisits = (visits || []).map(v => {
                const p = (patients || []).find(x => x.id == v.patient_id) || { name: 'غير معروف', age: 0, gender: 'ذكر' };
                return { ...v, patient: p };
            });
            renderPatients();
        }

        function renderPatients() {
            const list = document.getElementById('patientList');
            if (allVisits.length === 0) return list.innerHTML = '<div class="empty-msg">لا توجد زيارات</div>';

            list.innerHTML = allVisits.map(v => `
                <div class="patient-card ${v.visit_id === selectedVisitId ? 'active' : ''}" onclick="selectPatient(${v.visit_id})">
                    <div class="p-name">${v.patient.name}</div>
                    <div class="p-meta"><span>زيارة #${v.visit_id}</span><span>${v.patient.gender} • ${v.patient.age} سنة</span></div>
                </div>
            `).join('');
        }

        function getSmartParams(catalogItem) {
            let params = catalogItem.parameters ? JSON.parse(JSON.stringify(catalogItem.parameters)) : [];
            const isLipid = (catalogItem.name && catalogItem.name.toUpperCase().includes('LIPID')) || catalogItem.code === 'TL-109';
            
            if (isLipid) {
                if (!Array.isArray(params)) params = [];
                params = params.filter(p => !p.name.toLowerCase().includes('ldl'));
                params.push({ name: 'LDL', label: 'LDL (Calc)', unit: 'mg/dL', ref_male: '0 - 130', ref_female: '0 - 130', is_calc: true });
            }
            return params;
        }

        function selectPatient(visitId) {
            selectedVisitId = visitId;
            renderPatients();

            const singleList = document.getElementById('singleList');
            const profileList = document.getElementById('profileList');
            const vTests = visitTests.filter(vt => vt.visit_id === visitId);

            if (vTests.length === 0) {
                singleList.innerHTML = '<div class="empty-msg">لا توجد تحاليل</div>';
                profileList.innerHTML = '<div class="empty-msg">لا توجد تحاليل</div>';
                return;
            }

            let singlesHtml = '', profilesHtml = '';

            vTests.forEach(vt => {
                const catalogItem = testsCatalog.find(c => c.code === vt.test_code) || { name: vt.test_code, code: vt.test_code, parameters: [] };
                const result = testResults.find(r => r.visit_test_id === vt.id);
                const savedData = result ? result.results_data : {};
                
                const params = getSmartParams(catalogItem);
                const isProfile = params.length > 1 || (params.length === 1 && params[0].name !== 'Result');

                let inputsHtml = '';
                if (isProfile) {
                    params.forEach(param => {
                        const val = savedData[param.name]?.value || '';
                        const unit = param.unit || param.units || '';
                        const range = param.ref_male || param.reference_range || param.range || '-';
                        
                        const isCalc = param.is_calc === true || param.is_calculated === true || param.name === 'LDL';
                        const readonly = isCalc ? 'readonly' : '';
                        const calcClass = isCalc ? 'input-calc' : '';
                        const placeholder = isCalc ? 'تلقائى' : '...';

                        inputsHtml += `
                            <div class="input-group">
                                <label><span>${param.label || param.name}</span><span class="range-info">${range} ${unit}</span></label>
                                <input type="text" inputmode="decimal" class="${calcClass}" 
                                    id="res_${vt.id}_${param.name}" 
                                    data-name="${param.name}"
                                    value="${val}" placeholder="${placeholder}" ${readonly} 
                                    oninput="triggerCalc('${vt.id}', '${vt.test_code}')"
                                    onkeydown="handleEnter(event, this, ${vt.id}, ${isProfile})">
                            </div>
                        `;
                    });
                } else {
                    const val = savedData['result']?.value || '';
                    const p = params[0] || {};
                    const unit = p.unit || catalogItem.unit || '-';
                    const range = p.ref_male || catalogItem.reference_range || '-';
                    inputsHtml += `
                        <div class="input-group">
                            <label><span>النتيجة</span><span class="range-info">${range} ${unit}</span></label>
                            <input type="text" id="res_${vt.id}_simple" value="${val}" placeholder="..."
                                onkeydown="handleEnter(event, this, ${vt.id}, ${isProfile})">
                        </div>
                    `;
                }

                const cardHtml = `
                    <div class="test-item" id="card_${vt.id}">
                        <div class="test-header"><span>${catalogItem.name}</span><span style="font-size:0.8rem; color:#666;">${vt.test_code}</span></div>
                        <div class="test-body">
                            ${inputsHtml}
                            <div class="btn-group">
                                <button class="btn-save-test" onclick="saveTestResult(${vt.id}, ${isProfile}, false)">💾 حفظ</button>
                                <button class="btn-del-test" onclick="deleteTestResult(${vt.id})">🗑️ حذف</button>
                            </div>
                        </div>
                    </div>
                `;
                if (isProfile) profilesHtml += cardHtml; else singlesHtml += cardHtml;
            });

            singleList.innerHTML = singlesHtml || '<div class="empty-msg">لا توجد تحاليل فردية</div>';
            profileList.innerHTML = profilesHtml || '<div class="empty-msg">لا توجد تحاليل مركبة</div>';
            
            setTimeout(() => {
                const firstInput = document.querySelector('.test-item input:not([readonly])');
                if(firstInput) firstInput.focus();
            }, 100);
        }

        function handleEnter(e, el, vtId, isProfile) {
            let form = el.closest('.test-body');
            let inputs = Array.from(form.querySelectorAll('input:not([readonly])'));
            let index = inputs.indexOf(el);

            if (e.key === 'Enter' || e.key === 'ArrowDown') {
                e.preventDefault();
                if (e.key === 'Enter') saveTestResult(vtId, isProfile, true);
                
                if (index > -1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                } else {
                    let allCards = Array.from(document.querySelectorAll('.test-item'));
                    let cardIndex = allCards.indexOf(el.closest('.test-item'));
                    if (cardIndex > -1 && cardIndex < allCards.length - 1) {
                        let nextInput = allCards[cardIndex + 1].querySelector('input:not([readonly])');
                        if (nextInput) nextInput.focus();
                    }
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (index > 0) {
                    inputs[index - 1].focus();
                } else {
                    let allCards = Array.from(document.querySelectorAll('.test-item'));
                    let cardIndex = allCards.indexOf(el.closest('.test-item'));
                    if (cardIndex > 0) {
                        let prevInputs = allCards[cardIndex - 1].querySelectorAll('input:not([readonly])');
                        if (prevInputs.length > 0) prevInputs[prevInputs.length - 1].focus();
                    }
                }
            }
        }

        function triggerCalc(visitTestId, testCode) {
            const catalogItem = testsCatalog.find(c => c.code === testCode);
            if (!catalogItem) return;

            const params = getSmartParams(catalogItem);
            let vals = {};
            
            params.forEach(p => {
                const input = document.getElementById(`res_${visitTestId}_${p.name}`);
                if (input && input.value.trim() !== '') {
                    let parsed = parseFloat(input.value);
                    if (!isNaN(parsed)) vals[p.name] = parsed;
                }
            });

            let trig = vals['Triglycerides'] || vals['TRIG'] || vals['Trig'];
            let vldlInput = document.getElementById(`res_${visitTestId}_VLDL`);
            if (trig !== undefined && vldlInput) {
                let vldlVal = trig / 5;
                vldlInput.value = vldlVal.toFixed(1);
                vals['VLDL'] = vldlVal;
            }

            let cho = vals['Total Cholesterol'] || vals['CHO'] || vals['Cholesterol'];
            let hdl = vals['HDL'] || vals['Hdl'];
            let vldl = vals['VLDL'];
            let ldlInput = document.getElementById(`res_${visitTestId}_LDL`);
            
            if (cho !== undefined && hdl !== undefined && vldl !== undefined && ldlInput) {
                let ldlVal = cho - hdl - vldl;
                if (ldlVal < 0) ldlVal = 0;
                ldlInput.value = ldlVal.toFixed(1);
            }

            params.forEach(p => {
                let calcVal = null;
                let formula = p.formula;
                let pn = p.name.toLowerCase();

                let hb = vals['Hemoglobin'] || vals['HGB'] || vals['HB'] || vals['Hb'];
                let rbc = vals['RBCs'] || vals['RBC'] || vals['RBCs'];
                let hct = vals['HCT'] || vals['Hct'];

                if (!formula) {
                    if (pn === 'hct' && hb !== undefined) calcVal = hb * 3;
                    else if (pn === 'mcv' && hct !== undefined && rbc !== undefined && rbc > 0) calcVal = (hct * 10) / rbc;
                    else if (pn === 'mch' && hb !== undefined && rbc !== undefined && rbc > 0) calcVal = (hb * 10) / rbc;
                    else if (pn === 'mchc' && hb !== undefined && hct !== undefined && hct > 0) calcVal = (hb * 100) / hct;
                }
                
                if (formula) {
                    try {
                        let evalStr = formula;
                        let hasAllVars = true;
                        let vars = formula.match(/[a-zA-Z_]+/g) || [];
                        vars = vars.filter(v => v !== 'Math' && v !== 'min' && v !== 'max');
                        
                        for (let v of vars) {
                            let valToUse = undefined;
                            for (let key in vals) {
                                if (key.toLowerCase() === v.toLowerCase()) {
                                    valToUse = vals[key];
                                    break;
                                }
                            }
                            if (valToUse === undefined) { hasAllVars = false; break; }
                            evalStr = evalStr.replace(new RegExp('\\b' + v + '\\b', 'g'), valToUse);
                        }
                        
                        if (hasAllVars) calcVal = Function('"use strict";return (' + evalStr + ')')();
                    } catch(e) {}
                }

                if (calcVal !== null && isFinite(calcVal) && calcVal >= 0) {
                    const input = document.getElementById(`res_${visitTestId}_${p.name}`);
                    if (input) {
                        input.value = parseFloat(calcVal.toFixed(1));
                        vals[p.name] = calcVal;
                    }
                }
            });
        }

        async function saveTestResult(visitTestId, isProfile, isSilent = false) {
            const vt = visitTests.find(v => v.id === visitTestId);
            const catalogItem = testsCatalog.find(c => c.code === vt.test_code) || { code: vt.test_code, parameters: [] };
            const params = getSmartParams(catalogItem);
            
            let resultsData = {};

            if (isProfile) {
                params.forEach(param => {
                    const input = document.getElementById(`res_${visitTestId}_${param.name}`);
                    if (input && input.value.trim() !== '') resultsData[param.name] = { value: input.value.trim() };
                });
            } else {
                const input = document.getElementById(`res_${visitTestId}_simple`);
                if (input && input.value.trim() !== '') resultsData['result'] = { value: input.value.trim() };
            }

            if (Object.keys(resultsData).length === 0) {
                if (!isSilent) alert('لم يتم إدخال أي نتائج!');
                return;
            }

            const { error } = await _supabase.from('test_results').upsert({
                visit_test_id: visitTestId,
                results_data: resultsData
            }, { onConflict: 'visit_test_id' });

            if (error) return alert('خطأ: ' + error.message);
            
            const existingIndex = testResults.findIndex(r => r.visit_test_id === visitTestId);
            if (existingIndex > -1) testResults[existingIndex].results_data = resultsData;
            else testResults.push({ visit_test_id: visitTestId, results_data: resultsData });

            if (!isSilent) showToast('✅ تم الحفظ بنجاح');
            else showToast('💾 تم الحفظ تلقائياً');
        }

        async function deleteTestResult(visitTestId) {
            if(!confirm('هل أنت متأكد من حذف نتيجة هذا التحليل؟')) return;
            
            const { error } = await _supabase.from('test_results').delete().eq('visit_test_id', visitTestId);
            if(error) return alert('خطأ في الحذف: ' + error.message);

            const index = testResults.findIndex(r => r.visit_test_id === visitTestId);
            if(index > -1) testResults.splice(index, 1);

            const card = document.getElementById(`card_${visitTestId}`);
            if(card) card.querySelectorAll('input').forEach(input => input.value = '');
            
            showToast('🗑️ تم الحذف');
        }

        function getHeaderHtml(visit, reqDate, printDate) {
            return `
                <div class="print-header">
                    <div style="width: 50%; text-align: left;">
                        <h1 style="margin: 0; color: #000; font-size: 28px; font-weight: 900; letter-spacing: 1px;">TEBA LABS</h1>
                        <p style="margin: 4px 0 0 0; font-size: 15px; font-weight: 600; color: #000;">For Medical Analyzes</p>
                        <p style="margin: 2px 0 0 0; font-size: 14px; color: #333;">Dr. Ahmed Taha Abonda</p>
                    </div>
                    <div style="width: 50%; display: flex; justify-content: flex-end;">
                        <img src="header.png" alt="TEBA LABS" style="max-height: 90px; object-fit: contain;">
                    </div>
                </div>
                <div style="display: flex; justify-content: space-between; border: 1.5px solid #000; padding: 10px 15px; border-radius: 4px; background: #fff; font-size: 13px; margin-bottom: 20px; z-index: 2; position: relative;">
                    <div style="width: 50%; display: flex; flex-direction: column; gap: 5px;">
                        <div><strong style="color: #000; display: inline-block; width: 100px;">Patient:</strong> <span style="font-weight: bold;">${visit.patient.name || 'Unknown'}</span></div>
                        <div><strong style="color: #000; display: inline-block; width: 100px;">Age/Gender:</strong> <span style="font-weight: bold;">${visit.patient.age} Years / ${visit.patient.gender}</span></div>
                    </div>
                    <div style="width: 50%; display: flex; flex-direction: column; gap: 5px; text-align: right; border-left: 1.5px solid #000; padding-left: 15px;">
                        <div><strong style="color: #000; display: inline-block; width: 100px;">Visit ID:</strong> <span style="font-weight: bold;">${visit.visit_id}</span></div>
                        <div><strong style="color: #000; display: inline-block; width: 100px;">Request Date:</strong> <span style="font-weight: bold;">${reqDate}</span></div>
                        <div><strong style="color: #000; display: inline-block; width: 100px;">Print Date:</strong> <span style="font-weight: bold;">${printDate}</span></div>
                    </div>
                </div>
            `;
        }

        function getFooterHtml() {
            return `
                <div class="print-footer">
                    <div style="width: 40%; text-align: left; direction: ltr;">
                        <p style="margin: 4px 0; font-weight: bold; font-size: 13px; color: #000;">Tel: 01123702062</p>
                        <p style="margin: 4px 0; font-weight: bold; font-size: 13px; color: #000;">WhatsApp: 01099003494</p>
                    </div>
                    <div style="width: 60%; text-align: right; direction: rtl; color: #000; font-weight: bold; font-size: 12px;">
                        <p style="margin: 4px 0;">الفرع الأول: الجعافرة - الطريق العمومي - أعلى صيدلية الصحابة</p>
                        <p style="margin: 4px 0;">الفرع الثاني: بهتيم - مساكن اسكو - أمام مدرسة ابن الخطاب - عيادة د. محمد رمضان</p>
                    </div>
                </div>
            `;
        }

        function openPrintModal() {
            if (!selectedVisitId) return alert('اختر مريضاً أولاً!');
            const visit = allVisits.find(v => v.visit_id === selectedVisitId);
            const vTests = visitTests.filter(vt => vt.visit_id === selectedVisitId);

            const reqDate = visit.visit_date ? new Date(visit.visit_date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            const printDate = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

            const printArea = document.getElementById('print-area');
            printArea.innerHTML = '';

            let singlesRows = '';
            let profilesData = []; 

            vTests.forEach(vt => {
                const catalogItem = testsCatalog.find(c => c.code === vt.test_code) || { name: vt.test_code, code: vt.test_code, parameters: [] };
                const result = testResults.find(r => r.visit_test_id === vt.id);
                const savedData = result ? result.results_data : {};
                const params = getSmartParams(catalogItem);
                const isProfile = params.length > 1 || (params.length === 1 && params[0].name !== 'Result');

                let hasTestData = false;
                let testRows = '';

                if (isProfile) {
                    let localVals = {};
                    params.forEach(param => { if(savedData[param.name]?.value) localVals[param.name] = parseFloat(savedData[param.name].value); });
                    
                    if (catalogItem.name.toUpperCase().includes('LIPID') || catalogItem.code === 'TL-109') {
                        let trig = localVals['Triglycerides'] || localVals['TRIG'] || localVals['Trig'];
                        let cho = localVals['Total Cholesterol'] || localVals['CHO'] || localVals['Cholesterol'];
                        let hdl = localVals['HDL'] || localVals['Hdl'];
                        if (localVals['VLDL'] === undefined && trig !== undefined) localVals['VLDL'] = trig / 5;
                        if (localVals['LDL'] === undefined && cho !== undefined && hdl !== undefined && localVals['VLDL'] !== undefined) {
                            let ldl = cho - hdl - localVals['VLDL'];
                            localVals['LDL'] = ldl > 0 ? ldl : 0;
                        }
                    }

                    params.forEach(param => {
                        const val = localVals[param.name]?.toFixed(1) || savedData[param.name]?.value;
                        if (val) {
                            hasTestData = true;
                            const range = param.ref_male || param.reference_range || param.range || '-';
                            const unit = param.unit || param.units || '-';
                            
                            let flagStr = '';
                            const num = parseFloat(val);
                            const match = range.match(/([\d.]+)\s*[-–]\s*([\d.]+)/);
                            if (!isNaN(num) && match) {
                                const min = parseFloat(match[1]), max = parseFloat(match[2]);
                                if (num < min) flagStr = '<span style="border: 1px solid #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; color: #000; display: inline-block;">Low</span>';
                                else if (num > max) flagStr = '<span style="border: 1px solid #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; color: #000; display: inline-block;">High</span>';
                            }
                            
                            testRows += `<tr>
                                <td style="border-bottom: 1px solid #ccc; padding: 8px 6px;">${param.label || param.name}</td>
                                <td style="border-bottom: 1px solid #ccc; padding: 8px 6px; text-align:center; font-weight:bold; color: #000;">${val}</td>
                                <td style="border-bottom: 1px solid #ccc; padding: 8px 6px; text-align:center;">${flagStr}</td>
                                <td style="border-bottom: 1px solid #ccc; padding: 8px 6px; text-align:center;">${unit}</td>
                                <td style="border-bottom: 1px solid #ccc; padding: 8px 6px; text-align:center;">${range}</td>
                            </tr>`;
                        }
                    });
                    
                    if (hasTestData) profilesData.push({ name: catalogItem.name, rows: testRows });
                } else {
                    const val = savedData['result']?.value;
                    if (val) {
                        const p = params[0] || {};
                        const range = p.ref_male || catalogItem.reference_range || '-';
                        const unit = p.unit || catalogItem.unit || '-';
                        
                        let flagStr = '';
                        const num = parseFloat(val);
                        const match = range.match(/([\d.]+)\s*[-–]\s*([\d.]+)/);
                        if (!isNaN(num) && match) {
                            const min = parseFloat(match[1]), max = parseFloat(match[2]);
                            if (num < min) flagStr = '<span style="border: 1px solid #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; color: #000; display: inline-block;">Low</span>';
                            else if (num > max) flagStr = '<span style="border: 1px solid #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; color: #000; display: inline-block;">High</span>';
                        }

                        singlesRows += `<tr>
                            <td style="border-bottom: 1px solid #ccc; padding: 8px 6px;">${catalogItem.name}</td>
                            <td style="border-bottom: 1px solid #ccc; padding: 8px 6px; text-align:center; font-weight:bold; color: #000;">${val}</td>
                            <td style="border-bottom: 1px solid #ccc; padding: 8px 6px; text-align:center;">${flagStr}</td>
                            <td style="border-bottom: 1px solid #ccc; padding: 8px 6px; text-align:center;">${unit}</td>
                            <td style="border-bottom: 1px solid #ccc; padding: 8px 6px; text-align:center;">${range}</td>
                        </tr>`;
                    }
                }
            });

            if (singlesRows !== '' || profilesData.length === 0) {
                let pageHtml = `<div class="print-page">`;
                pageHtml += getHeaderHtml(visit, reqDate, printDate);
                
                if (singlesRows !== '') {
                    pageHtml += `
                        <div style="margin-bottom: 25px;">
                            <h3 style="margin: 0 0 10px 0; background: #eee; padding: 8px 12px; border-left: 4px solid #000; font-size: 15px; text-transform: uppercase; color: #000;">SINGLE TESTS</h3>
                            <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                                <thead>
                                    <tr style="background: #000; color: #fff;">
                                        <th style="padding: 8px 6px; text-align:left;">Test Name</th>
                                        <th style="padding: 8px 6px; text-align:center;">Result</th>
                                        <th style="padding: 8px 6px; text-align:center;">State</th>
                                        <th style="padding: 8px 6px; text-align:center;">Unit</th>
                                        <th style="padding: 8px 6px; text-align:center;">Ref. Range</th>
                                    </tr>
                                </thead>
                                <tbody>${singlesRows}</tbody>
                            </table>
                        </div>
                    `;
                } else {
                    pageHtml += `<p style="text-align:center; font-weight:bold; margin-top:50px;">No results recorded for this visit.</p>`;
                }
                
                pageHtml += getFooterHtml();
                pageHtml += `</div>`;
                printArea.innerHTML += pageHtml;
            }

            profilesData.forEach(profile => {
                let pageHtml = `<div class="print-page">`;
                pageHtml += getHeaderHtml(visit, reqDate, printDate);
                pageHtml += `
                    <div style="margin-bottom: 25px;">
                        <h3 style="margin: 0 0 10px 0; background: #eee; padding: 8px 12px; border-left: 4px solid #000; font-size: 15px; text-transform: uppercase; color: #000;">${profile.name}</h3>
                        <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                            <thead>
                                <tr style="background: #000; color: #fff;">
                                    <th style="padding: 8px 6px; text-align:left;">Test Name</th>
                                    <th style="padding: 8px 6px; text-align:center;">Result</th>
                                    <th style="padding: 8px 6px; text-align:center;">State</th>
                                    <th style="padding: 8px 6px; text-align:center;">Unit</th>
                                    <th style="padding: 8px 6px; text-align:center;">Ref. Range</th>
                                </tr>
                            </thead>
                            <tbody>${profile.rows}</tbody>
                        </table>
                    </div>
                `;
                pageHtml += getFooterHtml();
                pageHtml += `</div>`;
                printArea.innerHTML += pageHtml;
            });

            document.getElementById('printModal').style.display = 'flex';
        }

        function closePrintModal() { document.getElementById('printModal').style.display = 'none'; }

        window.onload = loadData;
    </script>
</body>
</html>
