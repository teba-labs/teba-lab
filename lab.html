<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معامل طيبة - بوابة المعمل (v15.2 Final)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-bg: #f4f7f6; --surface-bg: #ffffff; --primary-color: #2c3e50;
            --accent-color: #3498db; --success-color: #2ecc71; --danger-color: #e74c3c;
            --warning-color: #f39c12; --text-main: #333; --text-muted: #7f8c8d; 
            --border-color: #dcdde1; --shadow-sm: 0 2px 5px rgba(0,0,0,0.05);
            --shadow-md: 0 5px 15px rgba(0,0,0,0.08); --radius: 8px; 
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-family); background-color: var(--primary-bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background-color: var(--primary-color); color: white; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; box-shadow: var(--shadow-md); z-index: 10; }
        .brand-info { font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; gap: 10px;}
        .nav-links { display: flex; gap: 10px; }
        .nav-btn { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.95rem; display: flex; align-items: center; gap: 5px; transition: 0.2s; font-family: inherit;}
        .nav-btn:hover { background: rgba(255,255,255,0.2); }
        .nav-btn.rec { background: var(--accent-color); border-color: var(--accent-color); }
        .nav-btn.print { background: var(--warning-color); color: #333; border-color: var(--warning-color); }

        .main-container { display: grid; grid-template-columns: 350px 1fr 1fr; gap: 15px; padding: 15px; flex-grow: 1; height: calc(100vh - 60px); overflow: hidden; }
        
        .panel { background: var(--surface-bg); border-radius: var(--radius); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; border: 1px solid var(--border-color); overflow: hidden; }
        .panel-header { background: #f8f9fa; padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-weight: bold; color: var(--primary-color); text-align: center;}

        /* Right Column: Patients */
        .patients-list { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px;}
        .patient-card { padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: 0.2s; background: #fff; display: flex; justify-content: space-between; align-items: center;}
        .patient-card:hover { border-color: var(--accent-color); box-shadow: var(--shadow-sm); }
        .patient-card.active { border-color: var(--success-color); background: #f0fdf4; box-shadow: 0 0 0 2px rgba(46, 204, 113, 0.2); }
        .patient-card .info { flex-grow: 1; }
        .patient-card .p-name { font-weight: bold; font-size: 1.05rem; margin-bottom: 4px;}
        .patient-card .p-meta { font-size: 0.8rem; color: var(--text-muted); }
        .patient-card .status-icon { font-size: 1.5rem; color: var(--warning-color); }
        .patient-card.active .status-icon { color: var(--success-color); }

        /* Middle & Left Columns: Tests */
        .tests-container { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .test-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; background: #fff; }
        .test-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; border-bottom: 1px dashed #eee; padding-bottom: 5px;}
        .test-inputs { display: flex; flex-direction: column; gap: 10px; }
        .param-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px;}
        .param-row label { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between;}
        .param-row input { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; text-align: center; font-weight: bold; outline: none;}
        .param-row input:focus { border-color: var(--accent-color); }
        .btn-save-test { background: var(--success-color); color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; transition: 0.2s; font-family: inherit;}
        .btn-save-test:hover { background: #27ae60; }
        
        .empty-state { text-align: center; color: var(--text-muted); margin-top: 50px; font-size: 1.2rem; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: var(--radius); width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;}
        
        .print-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .print-table th, .print-table td { border: 1px solid #000; padding: 8px; text-align: right; font-size: 0.9rem;}
        .print-table th { background: #f8f9fa; }
        
        .print-header-info { text-align: center; margin-bottom: 20px; }
        .print-header-info h2 { margin-bottom: 5px; }
        .print-header-info p { margin: 2px 0; font-size: 0.95rem; }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; display: block !important; padding: 20px;}
            .modal-content { box-shadow: none; max-width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-info">🔬 المعمل - معامل طيبة (v15.2)</div>
        <div class="nav-links">
            <button class="nav-btn print" onclick="openPreview()">👁️ معاينة تقرير الزيارة</button>
            <button class="nav-btn rec" onclick="window.location.href='reception.html'">🏥 الاستقبال</button>
        </div>
    </header>

    <div class="main-container">
        <!-- المرضى -->
        <div class="panel">
            <div class="panel-header">طابور المرضى</div>
            <div class="patients-list" id="patientsList">
                <div class="empty-state">جاري التحميل...</div>
            </div>
        </div>

        <!-- التحاليل الفردية -->
        <div class="panel">
            <div class="panel-header">التحاليل الفردية (Single)</div>
            <div class="tests-container" id="singleTestsList">
                <div class="empty-state">اختر مريضاً من القائمة</div>
            </div>
        </div>

        <!-- التحاليل المركبة -->
        <div class="panel">
            <div class="panel-header">التحاليل المركبة (Profiles)</div>
            <div class="tests-container" id="profileTestsList">
                <div class="empty-state">اختر مريضاً من القائمة</div>
            </div>
        </div>
    </div>

    <!-- Modal: Preview -->
    <div class="modal" id="previewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>معاينة التقرير</h3>
                <button class="btn" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;" onclick="closeModal()">X</button>
            </div>
            
            <div id="print-area">
                <div class="print-header-info">
                    <h2>معامل طيبة للتحاليل الطبية</h2>
                    <p>تقرير نتائج التحاليل</p>
                    <div id="previewPatientData"></div>
                </div>
                <table class="print-table">
                    <thead>
                        <tr>
                            <th>التحليل</th>
                            <th>النتيجة</th>
                            <th>الوحدة</th>
                            <th>المدى المرجعي</th>
                            <th>الحالة</th>
                        </tr>
                    </thead>
                    <tbody id="previewTableBody"></tbody>
                </table>
                <p style="text-align:center; margin-top:20px; font-size:0.9rem;">توقيع الطبيب / الختم</p>
            </div>

            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                <button class="btn-save-test" style="width: 150px; background:var(--primary-color);" onclick="window.print()">🖨️ طباعة الآن</button>
                <button class="btn" style="background:#95a5a6; color:white; border:none; padding:10px; border-radius:6px; width: 100px; cursor:pointer;" onclick="closeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://khjzoleiuiipyodpkieg.supabase.co';
        const supabaseKey = 'sb_publishable_2Q7SPvruXJar3gvOxtvl5w_p4CVDfcU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let visitsData = []; // كل الزيارات
        let selectedVisitId = null;
        let catalogMap = {};

        // تحميل البيانات
        async function loadData() {
            const { data: visits, error: vErr } = await _supabase.from('visits').select('*').order('visit_id', { ascending: false });
            if (vErr) return alert('خطأ في تحميل الزيارات');

            const { data: patients } = await _supabase.from('patients').select('*');
            const { data: visitTests } = await _supabase.from('visit_tests').select('*');
            const { data: catalog } = await _supabase.from('tests_catalog').select('*');
            const { data: results } = await _supabase.from('test_results').select('*');

            catalog?.forEach(c => catalogMap[c.code] = c);

            // دمج البيانات
            visitsData = visits.map(v => {
                const p = patients?.find(x => x.id === v.patient_id || x.patient_id === v.patient_id) || {};
                const vTests = visitTests?.filter(t => t.visit_id === v.visit_id).map(t => {
                    const c = catalogMap[t.test_code] || { name: t.test_code, parameters: [] };
                    const res = results?.find(r => r.visit_test_id === t.id) || null;
                    return { ...t, test_name: c.name, parameters: c.parameters || [], result: res, unit: c.unit, ref: c.reference_range };
                }) || [];

                return { ...v, patient: p, tests: vTests };
            });

            renderPatients();
        }

        // رسم قائمة المرضى
        function renderPatients() {
            const list = document.getElementById('patientsList');
            if (!visitsData.length) return list.innerHTML = '<div class="empty-state">لا توجد زيارات</div>';

            list.innerHTML = visitsData.map(v => {
                const p = v.patient || {};
                const pName = p.full_name || p.name || 'غير معروف';
                const isDone = v.tests.length > 0 && v.tests.every(t => t.result !== null);
                
                return `
                    <div class="patient-card ${selectedVisitId === v.visit_id ? 'active' : ''}" onclick="selectVisit(${v.visit_id})">
                        <div class="info">
                            <div class="p-name">${pName}</div>
                            <div class="p-meta">زيارة #${v.visit_id} • ${p.age || '?'} سنة • ${p.gender === 'female' || p.gender === 'أنثى' ? 'أنثى' : 'ذكر'}</div>
                        </div>
                        <div class="status-icon">${isDone ? '✔️' : '⏳'}</div>
                    </div>
                `;
            }).join('');
        }

        // اختيار مريض
        function selectVisit(visitId) {
            selectedVisitId = visitId;
            renderPatients(); // لتحديد الكارت النشط

            const visit = visitsData.find(v => v.visit_id === visitId);
            if (!visit) return;

            const singleTests = visit.tests.filter(t => (t.parameters || []).length === 0);
            const profileTests = visit.tests.filter(t => (t.parameters || []).length > 0);

            renderTestList('singleTestsList', singleTests, visit.patient);
            renderTestList('profileTestsList', profileTests, visit.patient);
        }

        // رسم التحاليل
        function renderTestList(containerId, tests, patient) {
            const container = document.getElementById(containerId);
            if (!tests.length) return container.innerHTML = '<div class="empty-state">لا توجد تحاليل هنا</div>';

            container.innerHTML = tests.map(t => {
                const savedData = t.result?.results_data || {};
                let inputsHtml = '';

                if (t.parameters && t.parameters.length > 0) {
                    // تحليل مركب
                    t.parameters.forEach(p => {
                        const val = savedData[p.name]?.value || '';
                        const ref = patient.gender === 'female' || patient.gender === 'أنثى' ? p.ref_female : p.ref_male;
                        inputsHtml += `
                            <div class="param-row">
                                <label><span>${p.label || p.name}</span> <span style="font-size:0.75rem; color:#888">(${ref || '-'})</span></label>
                                <input type="text" id="val_${t.id}_${p.name}" value="${val}" placeholder="النتيجة">
                            </div>
                        `;
                    });
                } else {
                    // تحليل فردي
                    const val = savedData['result']?.value || '';
                    const ref = t.ref || '-';
                    const unit = t.unit || '-';
                    inputsHtml += `
                        <div class="param-row">
                            <label><span>النتيجة</span> <span style="font-size:0.75rem; color:#888">(${ref} ${unit !== '-' ? unit : ''})</span></label>
                            <input type="text" id="val_${t.id}_result" value="${val}" placeholder="النتيجة">
                        </div>
                    `;
                }

                return `
                    <div class="test-card">
                        <div class="test-header">
                            <span>${t.test_name}</span>
                            <span style="font-size:0.8rem; color:#888">${t.test_code}</span>
                        </div>
                        <div class="test-inputs">
                            ${inputsHtml}
                            <button class="btn-save-test" onclick="saveResult(${t.id})">💾 حفظ (أو اضغط Enter)</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // حفظ نتيجة
        async function saveResult(visitTestId) {
            const visit = visitsData.find(v => v.visit_id === selectedVisitId);
            const test = visit.tests.find(t => t.id === visitTestId);
            if (!test) return;

            const resultsData = {};
            const patient = visit.patient;

            if (test.parameters && test.parameters.length > 0) {
                for (let p of test.parameters) {
                    const val = document.getElementById(`val_${test.id}_${p.name}`).value.trim();
                    if (!val) return alert(`الرجاء إدخال نتيجة ${p.label || p.name}`);
                    
                    // حساب التقييم
                    const ref = patient.gender === 'female' || patient.gender === 'أنثى' ? p.ref_female : p.ref_male;
                    let flag = 'normal';
                    const num = parseFloat(val);
                    if (!isNaN(num) && ref) {
                        const range = ref.match(/([\d.]+)\s*[-–]\s*([\d.]+)/);
                        if (range) {
                            if (num < parseFloat(range[1])) flag = 'low';
                            if (num > parseFloat(range[2])) flag = 'high';
                        }
                    }
                    resultsData[p.name] = { value: val, flag: flag };
                }
            } else {
                const val = document.getElementById(`val_${test.id}_result`).value.trim();
                if (!val) return alert('الرجاء إدخال النتيجة');
                resultsData['result'] = { value: val, flag: 'normal' };
            }

            const btn = event.target;
            btn.innerText = 'جاري الحفظ...';
            btn.disabled = true;

            try {
                const { error } = await _supabase.from('test_results').upsert({
                    visit_test_id: test.id,
                    results_data: resultsData
                }, { onConflict: 'visit_test_id' });

                if (error) throw error;
                
                // تحديث الداتا محلياً
                test.result = { results_data: resultsData };
                
                btn.innerText = '✅ تم الحفظ';
                setTimeout(() => { btn.innerText = '💾 حفظ (أو اضغط Enter)'; btn.disabled = false; }, 2000);
                
                renderPatients(); // تحديث حالة المريض (علامة الصح)

            } catch (err) {
                alert('خطأ: ' + err.message);
                btn.innerText = '💾 حفظ';
                btn.disabled = false;
            }
        }

        // فتح المعاينة (تجميع كل التحاليل)
        function openPreview() {
            if (!selectedVisitId) return alert('الرجاء اختيار مريض أولاً من القائمة اليمنى');

            const visit = visitsData.find(v => v.visit_id === selectedVisitId);
            const p = visit.patient || {};
            const pName = p.full_name || p.name || 'غير معروف';
            
            document.getElementById('previewPatientData').innerHTML = `
                <p><strong>المريض:</strong> ${pName} | <strong>العمر:</strong> ${p.age || '?'} سنة | <strong>النوع:</strong> ${p.gender === 'female' || p.gender === 'أنثى' ? 'أنثى' : 'ذكر'}</p>
                <p><strong>زيارة رقم:</strong> ${visit.visit_id} | <strong>التاريخ:</strong> ${visit.visit_date || new Date().toLocaleDateString('ar-EG')}</p>
            `;

            const tbody = document.getElementById('previewTableBody');
            let rowsHtml = '';

            // لفة على كل تحاليل الزيارة (فردية ومركبة)
            visit.tests.forEach(t => {
                const res = t.result?.results_data || {};
                
                if (t.parameters && t.parameters.length > 0) {
                    // تحليل مركب (بنفصل باراميترزه)
                    t.parameters.forEach(param => {
                        const pData = res[param.name] || {};
                        const val = pData.value || '-';
                        const flag = pData.flag || 'normal';
                        const ref = p.gender === 'female' || p.gender === 'أنثى' ? param.ref_female : param.ref_male;
                        
                        const flagText = flag === 'high' ? '<span style="color:red; font-weight:bold;">H</span>' : flag === 'low' ? '<span style="color:blue; font-weight:bold;">L</span>' : 'N';
                        
                        rowsHtml += `
                            <tr>
                                <td>${t.test_name} - ${param.label || param.name}</td>
                                <td style="font-weight:bold;">${val}</td>
                                <td>${param.unit || '-'}</td>
                                <td>${ref || '-'}</td>
                                <td>${val !== '-' ? flagText : '-'}</td>
                            </tr>
                        `;
                    });
                } else {
                    // تحليل فردي
                    const val = res['result']?.value || '-';
                    const flag = res['result']?.flag || 'normal';
                    const flagText = flag === 'high' ? '<span style="color:red; font-weight:bold;">H</span>' : flag === 'low' ? '<span style="color:blue; font-weight:bold;">L</span>' : (val !== '-' ? 'N' : '-');
                    
                    rowsHtml += `
                        <tr>
                            <td>${t.test_name}</td>
                            <td style="font-weight:bold;">${val}</td>
                            <td>${t.unit || '-'}</td>
                            <td>${t.ref || '-'}</td>
                            <td>${flagText}</td>
                        </tr>
                    `;
                }
            });

            if (!rowsHtml) return alert('لا توجد تحاليل في هذه الزيارة');
            tbody.innerHTML = rowsHtml;
            
            document.getElementById('previewModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('previewModal').style.display = 'none';
        }

        window.onload = loadData;
    </script>
</body>
</html>
