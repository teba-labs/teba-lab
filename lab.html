<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معامل طيبة - محطة العمل (v14)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-bg: #f4f7f6; --surface-bg: #ffffff; --primary-color: #2c3e50;
            --accent-color: #3498db; --success-color: #2ecc71; --danger-color: #e74c3c;
            --warning-color: #f39c12; --text-main: #333; --text-muted: #7f8c8d; 
            --border-color: #dcdde1; --shadow-sm: 0 2px 5px rgba(0,0,0,0.05);
            --shadow-md: 0 5px 15px rgba(0,0,0,0.08); --radius: 8px; 
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-family); background-color: var(--primary-bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header */
        header { background-color: var(--primary-color); color: white; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; box-shadow: var(--shadow-md); z-index: 10; }
        .brand-info { font-weight: bold; font-size: 1.1rem; }
        .nav-btn { background: var(--accent-color); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: inherit; text-decoration: none;}
        .nav-btn.back { background: var(--warning-color); color: #333;}

        /* Views */
        .view { display: none; flex-grow: 1; height: calc(100vh - 60px); overflow: hidden; }
        .view.active { display: flex; flex-direction: column; }

        /* --- View 1: Queue (Cards) --- */
        .queue-container { max-width: 1400px; margin: 0 auto; padding: 20px; width: 100%; overflow-y: auto; }
        .toolbar { background: var(--surface-bg); border-radius: var(--radius); padding: 15px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; box-shadow: var(--shadow-sm); }
        .search-box input { width: 100%; padding: 10px 15px; border: 2px solid var(--border-color); border-radius: var(--radius); outline: none; font-family: inherit;}
        .tabs { display: flex; gap: 5px; background: #eee; padding: 4px; border-radius: var(--radius); }
        .tab { padding: 8px 16px; border: none; background: transparent; cursor: pointer; font-weight: bold; border-radius: 5px; font-family: inherit;}
        .tab.active { background: var(--surface-bg); color: var(--primary-color); box-shadow: var(--shadow-sm); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .card { background: var(--surface-bg); border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); display: flex; flex-direction: column; cursor: pointer; transition: 0.2s;}
        .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--accent-color);}
        .card.pending { border-top: 4px solid var(--warning-color); }
        .card.done { border-top: 4px solid var(--success-color); }
        .card-header { padding: 12px 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; }
        .p-name { font-weight: bold; color: var(--primary-color); }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge.pending { background: #ffeaa7; color: #d35400; }
        .badge.done { background: #d4edda; color: #27ae60; }
        .card-body { padding: 15px; flex-grow: 1; }
        .test-info { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold;}
        .card-footer { padding: 12px 15px; border-top: 1px solid var(--border-color); background: #fafafa; text-align: center;}
        .btn-open { background: var(--accent-color); color: white; padding: 8px 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; width: 100%;}

        /* --- View 2: Workstation (3 Columns) --- */
        .workstation { display: grid; grid-template-columns: 300px 1fr 1fr; gap: 15px; padding: 15px; height: 100%; overflow: hidden; background: var(--primary-bg); }
        .column { background: var(--surface-bg); border-radius: var(--radius); border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }
        .col-header { padding: 15px; background: #f8f9fa; border-bottom: 2px solid var(--border-color); font-weight: bold; color: var(--primary-color); text-align: center; }
        .col-body { padding: 15px; overflow-y: auto; flex-grow: 1; }

        /* Column 1: Patient Queue */
        .patient-list-item { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .patient-list-item:hover, .patient-list-item.active { background: #e3f2fd; border-color: var(--accent-color); }
        .patient-list-item .name { font-weight: bold; color: var(--primary-color); }
        .patient-list-item .meta { font-size: 0.8rem; color: var(--text-muted); }

        /* Column 2 & 3: Tests */
        .test-block { border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 15px; overflow: hidden; }
        .test-block-header { background: #f1f5f9; padding: 10px 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);}
        .test-block-body { padding: 15px; }
        
        .form-group { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .form-group label { flex: 1; font-size: 0.9rem; font-weight: bold;}
        .form-group input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; text-align: center; font-weight: bold;}
        .form-group .unit { width: 60px; font-size: 0.8rem; color: var(--text-muted); text-align: center;}
        .form-group .ref { width: 80px; font-size: 0.8rem; color: var(--text-muted); text-align: center;}
        
        .save-btn { background: var(--success-color); color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        
        .flag-high { color: var(--danger-color); font-weight: bold; }
        .flag-low { color: var(--accent-color); font-weight: bold; }
        .flag-normal { color: var(--success-color); font-weight: bold; }
        
        .empty-msg { text-align: center; padding: 20px; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="brand-info">🔬 المعمل - معامل طيبة (v14)</div>
        <div>
            <button class="nav-btn back" id="backBtn" style="display:none;" onclick="switchView('queue')">↩ رجوع للطابور</button>
            <button class="nav-btn" onclick="window.location.href='reception.html'">🏥 الاستقبال</button>
        </div>
    </header>

    <!-- View 1: Queue -->
    <div class="view active" id="queueView">
        <div class="queue-container">
            <div class="toolbar">
                <div class="tabs">
                    <button class="tab active" onclick="setFilter('all')" id="tab-all">الكل</button>
                    <button class="tab" onclick="setFilter('pending')" id="tab-pending">مطلوب</button>
                    <button class="tab" onclick="setFilter('done')" id="tab-done">تم الانتهاء</button>
                </div>
                <div class="search-box" style="flex-grow:1;">
                    <input type="text" id="searchInput" placeholder="بحث باسم المريض..." onkeyup="renderQueue()">
                </div>
            </div>
            <div class="grid" id="labGrid"></div>
        </div>
    </div>

    <!-- View 2: Workstation (3 Columns) -->
    <div class="view" id="workstationView">
        <div class="workstation">
            <!-- Right: Patients List -->
            <div class="column">
                <div class="col-header">المرضى (طابور)</div>
                <div class="col-body" id="wsPatientList"></div>
            </div>

            <!-- Middle: Single Tests -->
            <div class="column">
                <div class="col-header">التحاليل الفردية (Single)</div>
                <div class="col-body" id="wsSingleTests">
                    <div class="empty-msg">اختر مريض من القائمة</div>
                </div>
            </div>

            <!-- Left: Profile Tests -->
            <div class="column">
                <div class="col-header">التحاليل المركبة (Profiles)</div>
                <div class="col-body" id="wsProfileTests">
                    <div class="empty-msg">اختر مريض من القائمة</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://khjzoleiuiipyodpkieg.supabase.co';
        const supabaseKey = 'sb_publishable_2Q7SPvruXJar3gvOxtvl5w_p4CVDfcU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let allVisits = []; // كل الزيارات
        let allVT = [];     // كل التحاليل المطلوبة
        let allCatalog = []; // الكتالوج
        let allResults = []; // النتائج
        let activeVisitId = null;
        let currentFilter = 'all';

        // دالة مساعدة لحساب التقييم
        function calcFlag(val, ref) {
            if (!val || !ref) return 'normal';
            const num = parseFloat(val);
            if (isNaN(num)) return 'normal';
            const range = ref.match(/([\d.]+)\s*[-–]\s*([\d.]+)/);
            if (range) {
                const min = parseFloat(range[1]), max = parseFloat(range[2]);
                if (num < min) return 'low';
                if (num > max) return 'high';
            }
            return 'normal';
        }

        // 1. تحميل كل البيانات من السحابة مرة واحدة
        async function loadData() {
            try {
                const { data: v } = await _supabase.from('visits').select('*').order('visit_id', { ascending: false });
                const { data: p } = await _supabase.from('patients').select('*');
                const { data: vt } = await _supabase.from('visit_tests').select('*');
                const { data: c } = await _supabase.from('tests_catalog').select('*');
                const { data: r } = await _supabase.from('test_results').select('*');

                // ربط المريض بالزيارة
                allVisits = (v || []).map(visit => {
                    const pat = (p || []).find(pat => pat.id == visit.patient_id || pat.patient_id == visit.patient_id) || {};
                    return { ...visit, patient: pat };
                });

                allVT = vt || [];
                allCatalog = c || [];
                allResults = r || [];

                renderQueue();
            } catch (err) {
                alert('خطأ في تحميل البيانات: ' + err.message);
            }
        }

        // 2. رسم الكروت (Queue View)
        function renderQueue() {
            const grid = document.getElementById('labGrid');
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            // فلترة الزيارات
            let filtered = allVisits.filter(visit => {
                const pName = (visit.patient.full_name || visit.patient.name || '').toLowerCase();
                if (query && !pName.includes(query)) return false;

                // فلترة الحالة
                const visitTests = allVT.filter(vt => vt.visit_id == visit.visit_id || vt.visit_id == visit.id);
                if (visitTests.length === 0) return false;

                const allDone = visitTests.every(vt => allResults.find(r => r.visit_test_id == vt.id));
                if (currentFilter === 'pending' && allDone) return false;
                if (currentFilter === 'done' && !allDone) return false;

                return true;
            });

            if (!filtered.length) {
                grid.innerHTML = '<div class="empty-msg">لا توجد طلبات</div>';
                return;
            }

            grid.innerHTML = filtered.map(visit => {
                const p = visit.patient;
                const visitTests = allVT.filter(vt => vt.visit_id == visit.visit_id || vt.visit_id == visit.id);
                const allDone = visitTests.every(vt => allResults.find(r => r.visit_test_id == vt.id));
                const statusClass = allDone ? 'done' : 'pending';
                const pName = p.full_name || p.name || 'غير معروف';
                
                return `
                    <div class="card ${statusClass}" onclick="openWorkstation('${visit.visit_id || visit.id}')">
                        <div class="card-header">
                            <div><div class="p-name">${pName}</div><div style="font-size:0.8rem; color:#666;">${p.gender === 'female' || p.gender === 'أنثى' ? 'أنثى' : 'ذكر'} • ${p.age || '?'} سنة</div></div>
                            <span class="badge ${statusClass}">${allDone ? 'مكتمل' : 'مطلوب'}</span>
                        </div>
                        <div class="card-body">
                            <div class="test-info"><span>عدد التحاليل: ${visitTests.length}</span> <span>زيارة #${visit.visit_id || visit.id}</span></div>
                        </div>
                        <div class="card-footer">
                            <button class="btn-open">فتح محطة العمل ➡</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 3. فتح محطة العمل (Workstation)
        window.openWorkstation = function(visitId) {
            activeVisitId = visitId;
            document.getElementById('queueView').classList.remove('active');
            document.getElementById('workstationView').classList.add('active');
            document.getElementById('backBtn').style.display = 'inline-block';

            renderWsPatientList();
            renderWsTests();
        }

        window.switchView = function(view) {
            if(view === 'queue') {
                document.getElementById('workstationView').classList.remove('active');
                document.getElementById('queueView').classList.add('active');
                document.getElementById('backBtn').style.display = 'none';
                activeVisitId = null;
                renderQueue(); // تحديث الكروت
            }
        }

        // 4. رسم قائمة المرضى في محطة العمل
        function renderWsPatientList() {
            const list = document.getElementById('wsPatientList');
            list.innerHTML = allVisits.map(visit => {
                const p = visit.patient;
                const pName = p.full_name || p.name || 'غير معروف';
                const isActive = (visit.visit_id == activeVisitId || visit.id == activeVisitId);
                
                return `
                    <div class="patient-list-item ${isActive ? 'active' : ''}" onclick="openWorkstation('${visit.visit_id || visit.id}')">
                        <div class="name">${pName}</div>
                        <div class="meta">زيارة #${visit.visit_id || visit.id} - ${p.age || '?'} سنة</div>
                    </div>
                `;
            }).join('');
        }

        // 5. رسم التحاليل في الأعمدة (فردي ومركب)
        function renderWsTests() {
            const singleCol = document.getElementById('wsSingleTests');
            const profileCol = document.getElementById('wsProfileTests');
            
            const visitTests = allVT.filter(vt => vt.visit_id == activeVisitId);
            
            if (!visitTests.length) {
                singleCol.innerHTML = '<div class="empty-msg">لا توجد تحاليل</div>';
                profileCol.innerHTML = '<div class="empty-msg">لا توجد تحاليل</div>';
                return;
            }

            let singleHtml = '';
            let profileHtml = '';

            visitTests.forEach(vt => {
                const cat = allCatalog.find(c => c.code === vt.test_code) || { name: vt.test_code, parameters: [] };
                const result = allResults.find(r => r.visit_test_id == vt.id);
                const savedData = result?.results_data || {};
                const params = cat.parameters || [];

                if (params.length > 0) {
                    // تحليل مركب (Profile)
                    let inputsHtml = '';
                    params.forEach(param => {
                        const ref = ref = param.ref_male; // للتبسيط دلوقتي
                        const savedVal = savedData[param.name]?.value || '';
                        const savedFlag = savedData[param.name]?.flag || 'normal';
                        
                        inputsHtml += `
                            <div class="form-group">
                                <label>${param.label}</label>
                                <input type="text" id="val_${vt.id}_${param.name}" value="${savedVal}" oninput="checkFlag('${vt.id}', '${param.name}', '${ref}')">
                                <span class="unit">${param.unit}</span>
                                <span class="ref">${ref}</span>
                                <span id="flag_${vt.id}_${param.name}" class="flag-${savedFlag}">${savedFlag === 'high' ? 'H' : savedFlag === 'low' ? 'L' : 'N'}</span>
                            </div>
                        `;
                    });

                    profileHtml += `
                        <div class="test-block">
                            <div class="test-block-header"><span>${cat.name}</span> <span>${vt.test_code}</span></div>
                            <div class="test-block-body">
                                ${inputsHtml}
                                <button class="save-btn" onclick="saveProfileResult(${vt.id})">💾 حفظ نتيجة ${cat.name}</button>
                            </div>
                        </div>
                    `;
                } else {
                    // تحليل فردي (Single)
                    const val = savedData['result']?.value || '';
                    singleHtml += `
                        <div class="test-block">
                            <div class="test-block-header"><span>${cat.name}</span> <span>${vt.test_code}</span></div>
                            <div class="test-block-body">
                                <div class="form-group">
                                    <label>النتيجة:</label>
                                    <input type="text" id="val_single_${vt.id}" value="${val}">
                                </div>
                                <button class="save-btn" onclick="saveSingleResult(${vt.id})">💾 حفظ النتيجة</button>
                            </div>
                        </div>
                    `;
                }
            });

            singleCol.innerHTML = singleHtml || '<div class="empty-msg">لا توجد تحاليل فردية</div>';
            profileCol.innerHTML = profileHtml || '<div class="empty-msg">لا توجد تحاليل مركبة</div>';
        }

        // 6. دوال الحفظ
        window.checkFlag = function(vtId, paramName, ref) {
            const val = document.getElementById(`val_${vtId}_${paramName}`).value;
            const flag = calcFlag(val, ref);
            const span = document.getElementById(`flag_${vtId}_${paramName}`);
            span.className = `flag-${flag}`;
            span.innerText = flag === 'high' ? 'H' : flag === 'low' ? 'L' : 'N';
        }

        window.saveSingleResult = async function(vtId) {
            const val = document.getElementById(`val_single_${vtId}`).value.trim();
            if(!val) return alert('أدخل النتيجة أولاً');

            const btn = event.target;
            btn.innerText = 'جاري الحفظ...'; btn.disabled = true;

            try {
                const { error } = await _supabase.from('test_results').upsert({
                    visit_test_id: vtId,
                    results_data: { 'result': { value: val, flag: 'normal' } }
                }, { onConflict: 'visit_test_id' });
                if(error) throw error;
                
                // تحديث الداتا المحلية
                const existing = allResults.find(r => r.visit_test_id == vtId);
                if(existing) existing.results_data = { 'result': { value: val, flag: 'normal' } };
                else allResults.push({ visit_test_id: vtId, results_data: { 'result': { value: val, flag: 'normal' } } });
                
                btn.innerText = '✅ تم الحفظ'; btn.style.background = '#2c3e50';
                setTimeout(() => { btn.innerText = '💾 حفظ النتيجة'; btn.disabled = false; btn.style.background = 'var(--success-color)'; }, 2000);

            } catch(err) { alert('خطأ: ' + err.message); btn.disabled = false; btn.innerText = '💾 حفظ النتيجة';}
        }

        window.saveProfileResult = async function(vtId) {
            const cat = allCatalog.find(c => c.code === allVT.find(v => v.id == vtId).test_code);
            const params = cat.parameters;
            const resultsData = {};

            for(let param of params) {
                const val = document.getElementById(`val_${vtId}_${param.name}`).value.trim();
                if(!val) return alert(`أدخل نتيجة ${param.label}`);
                const flag = calcFlag(val, param.ref_male);
                resultsData[param.name] = { value: val, flag: flag };
            }

            const btn = event.target;
            btn.innerText = 'جاري الحفظ...'; btn.disabled = true;

            try {
                const { error } = await _supabase.from('test_results').upsert({
                    visit_test_id: vtId,
                    results_data: resultsData
                }, { onConflict: 'visit_test_id' });
                if(error) throw error;
                
                const existing = allResults.find(r => r.visit_test_id == vtId);
                if(existing) existing.results_data = resultsData;
                else allResults.push({ visit_test_id: vtId, results_data: resultsData });
                
                btn.innerText = '✅ تم الحفظ'; btn.style.background = '#2c3e50';
                setTimeout(() => { btn.innerText = `💾 حفظ نتيجة ${cat.name}`; btn.disabled = false; btn.style.background = 'var(--success-color)'; }, 2000);

            } catch(err) { alert('خطأ: ' + err.message); btn.disabled = false; btn.innerText = `💾 حفظ نتيجة ${cat.name}`;}
        }

        // تشغيل
        window.onload = loadData;
    </script>
</body>
</html>
