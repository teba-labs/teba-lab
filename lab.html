<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معامل طيبة - شاشة المعمل (v16)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #f0f2f5; --panel: #ffffff; --border: #d1d5db; --text: #1f2937;
            --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: #1e293b; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-weight: bold; font-size: 1.1rem; }
        .nav-btn { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 10px; }
        
        .main-container { display: grid; grid-template-columns: 300px 1fr 1fr; gap: 15px; padding: 15px; flex-grow: 1; height: calc(100vh - 60px); }
        .panel { background: var(--panel); border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .panel-header { background: #f8fafc; padding: 12px; border-bottom: 1px solid var(--border); font-weight: bold; color: #334155; font-size: 1rem; text-align: center;}

        /* Column 1: Queue */
        .queue-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .q-item { padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .q-item:hover { border-color: var(--primary); background: #f0f9ff; }
        .q-item.active { border-color: var(--primary); background: #e0f2fe; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
        .q-name { font-weight: bold; font-size: 0.95rem; color: #1e293b; }
        .q-meta { font-size: 0.8rem; color: #64748b; margin-top: 4px; display: flex; justify-content: space-between;}

        /* Columns 2 & 3: Inputs */
        .tests-area { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .test-block { border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: #fff; }
        .test-header { font-weight: bold; color: #0f172a; border-bottom: 1px dashed var(--border); padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between;}
        .test-code { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; color: #475569;}
        
        .input-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 8px; }
        .input-row label { font-size: 0.85rem; font-weight: 600; color: #334155; }
        .unit-lbl { font-size: 0.8rem; color: #64748b; text-align: center; }
        .ref-lbl { font-size: 0.8rem; color: #64748b; text-align: center; direction: ltr;}
        
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-family: var(--font); font-size: 1rem; font-weight: bold; text-align: center; outline: none; transition: 0.2s; }
        input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
        input.calc-field { background: #f8fafc; color: #64748b; cursor: not-allowed; }

        .save-btn { background: var(--success); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: var(--font); font-size: 0.9rem; margin-top: 10px; transition: 0.2s;}
        .save-btn:hover { background: #059669; }
        .save-btn:disabled { background: #94a3b8; cursor: not-allowed; }

        .empty-state { text-align: center; color: #94a3b8; margin-top: 50px; font-weight: bold; }
        
        /* Print Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 800px; max-height: 90vh; border-radius: 8px; display: flex; flex-direction: column; }
        .modal-header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;}
        .print-area { padding: 30px; overflow-y: auto; background: white; flex-grow: 1;}
        
        .print-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .print-table th, .print-table td { border: 1px solid #000; padding: 8px; text-align: right; font-size: 0.9rem; }
        .print-table th { background: #f1f5f9; }
        .flag-H { color: red; font-weight: bold; }
        .flag-L { color: blue; font-weight: bold; }

        @media print {
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">🔬 المعمل - معامل طيبة (v16)</div>
        <div>
            <button class="nav-btn" style="background: #f59e0b;" onclick="printVisitReport()">🖨️ طباعة تقرير الزيارة</button>
            <button class="nav-btn" onclick="window.location.href='reception.html'">🏥 الاستقبال</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Column 1: Patients Queue -->
        <div class="panel">
            <div class="panel-header">طابور المرضى</div>
            <div class="queue-list" id="queueList">
                <div class="empty-state">جاري التحميل...</div>
            </div>
        </div>

        <!-- Column 2: Single Tests -->
        <div class="panel">
            <div class="panel-header">التحاليل الفردية (Single)</div>
            <div class="tests-area" id="singleArea">
                <div class="empty-state">اختر مريض من القائمة</div>
            </div>
        </div>

        <!-- Column 3: Profiles -->
        <div class="panel">
            <div class="panel-header">التحاليل المركبة (Profiles)</div>
            <div class="tests-area" id="profileArea">
                <div class="empty-state">اختر مريض من القائمة</div>
            </div>
        </div>
    </div>

    <!-- Print Modal -->
    <div class="modal" id="printModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>معاينة الطباعة</h3>
                <div>
                    <button class="nav-btn" style="background: var(--success);" onclick="window.print()">طباعة الآن</button>
                    <button class="nav-btn" style="background: var(--danger);" onclick="document.getElementById('printModal').style.display='none'">إلغاء</button>
                </div>
            </div>
            <div class="print-area" id="printContent"></div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://khjzoleiuiipyodpkieg.supabase.co';
        const supabaseKey = 'sb_publishable_2Q7SPvruXJar3gvOxtvl5w_p4CVDfcU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let allVisits = [];
        let catalogMap = {};
        let currentVisit = null;
        
        // 1. تحميل البيانات
        async function loadData() {
            const { data: visits } = await _supabase.from('visits').select(`*, patients (*)`);
            const { data: vt } = await _supabase.from('visit_tests').select('*');
            const { data: catalog } = await _supabase.from('tests_catalog').select('*');
            const { data: results } = await _supabase.from('test_results').select('*');

            catalog?.forEach(c => catalogMap[c.code] = c);
            const resMap = {};
            results?.forEach(r => resMap[r.visit_test_id] = r);

            // تجميع بيانات المرضى
            allVisits = [];
            const visitMap = {};
            
            visits?.forEach(v => {
                const p = v.patients || {};
                visitMap[v.visit_id] = { ...v, patient: p, tests: [] };
                allVisits.push(visitMap[v.visit_id]);
            });

            vt?.forEach(test => {
                if(visitMap[test.visit_id]) {
                    const cat = catalogMap[test.test_code] || { name: test.test_code, type: 'Single', parameters: [] };
                    visitMap[test.visit_id].tests.push({
                        ...test,
                        test_info: cat,
                        result: resMap[test.id] || null
                    });
                }
            });

            renderQueue();
        }

        // 2. رسم قائمة المرضى
        function renderQueue() {
            const list = document.getElementById('queueList');
            if(allVisits.length === 0) return list.innerHTML = '<div class="empty-state">لا يوجد مرضى</div>';

            list.innerHTML = allVisits.map(v => {
                const p = v.patient;
                const pName = p.name || p.full_name || 'غير معروف';
                const isActive = currentVisit && currentVisit.visit_id === v.visit_id;
                return `
                    <div class="q-item ${isActive ? 'active' : ''}" onclick="selectVisit(${v.visit_id})">
                        <div class="q-name">${pName}</div>
                        <div class="q-meta">
                            <span>زيارة #${v.visit_id}</span>
                            <span>${p.age || '?'} سنة • ${p.gender === 'female' ? 'أنثى' : 'ذكر'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 3. اختيار مريض وتجهيز الشاشة
        function selectVisit(visitId) {
            currentVisit = allVisits.find(v => v.visit_id === visitId);
            renderQueue(); // لتحديث اللون

            const singleArea = document.getElementById('singleArea');
            const profileArea = document.getElementById('profileArea');
            
            const singles = currentVisit.tests.filter(t => t.test_info.type === 'Single' || !t.test_info.parameters || t.test_info.parameters.length === 0);
            const profiles = currentVisit.tests.filter(t => t.test_info.type === 'Profile' || (t.test_info.parameters && t.test_info.parameters.length > 0));

            // رسم التحاليل الفردية
            if(singles.length === 0) {
                singleArea.innerHTML = '<div class="empty-state">لا توجد تحاليل فردية</div>';
            } else {
                singleArea.innerHTML = singles.map(t => {
                    const val = t.result?.results_data?.result?.value || '';
                    const isDone = t.result !== null;
                    return `
                        <div class="test-block">
                            <div class="test-header"><span>${t.test_info.name}</span> <span class="test-code">${t.test_code}</span></div>
                            <div class="input-row" style="grid-template-columns: 1fr;">
                                <input type="text" id="inp_${t.id}" value="${val}" placeholder="النتيجة..." onkeydown="handleKeyNav(event)" oninput="updateSingle(${t.id})">
                            </div>
                            <button class="save-btn" id="btn_${t.id}" onclick="saveSingle(${t.id})">${isDone ? 'تحديث النتيجة' : 'حفظ النتيجة (Enter)'}</button>
                        </div>
                    `;
                }).join('');
            }

            // رسم التحاليل المركبة (Profiles)
            if(profiles.length === 0) {
                profileArea.innerHTML = '<div class="empty-state">لا توجد تحاليل مركبة</div>';
            } else {
                profileArea.innerHTML = profiles.map(t => {
                    const params = t.test_info.parameters || [];
                    const savedData = t.result?.results_data || {};
                    const gender = currentVisit.patient.gender;
                    
                    let paramsHtml = params.map(param => {
                        const ref = gender === 'female' || gender === 'أنثى' ? param.ref_female : param.ref_male;
                        const savedVal = savedData[param.name]?.value || '';
                        // لو الحقل بيتحسب تلقائي (HCT, MCV...)
                        const isCalc = ['HCT', 'MCV', 'MCH', 'MCHC'].includes(param.name);
                        
                        return `
                            <div class="input-row">
                                <label>${param.label} <small>(${param.name})</small></label>
                                <input type="text" id="inp_${t.id}_${param.name}" value="${savedVal}" 
                                    class="${isCalc ? 'calc-field' : ''}" 
                                    ${isCalc ? 'readonly' : `oninput="runCalculations(${t.id})"`}
                                    onkeydown="handleKeyNav(event)">
                                <div class="unit-lbl">${param.unit || '-'}</div>
                                <div class="ref-lbl">${ref || '-'}</div>
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="test-block">
                            <div class="test-header"><span>${t.test_info.name}</span> <span class="test-code">${t.test_code}</span></div>
                            ${paramsHtml}
                            <button class="save-btn" id="btn_${t.id}" onclick="saveProfile(${t.id})">حفظ التحليل كاملاً</button>
                        </div>
                    `;
                }).join('');
            }
        }

        // 4. التنقل بالكيبورد (Enter والأسهم)
        function handleKeyNav(e) {
            const inputs = Array.from(document.querySelectorAll('input[type="text"]:not(.calc-field)'));
            const idx = inputs.indexOf(e.target);

            if (e.key === 'Enter' || e.key === 'ArrowDown') {
                e.preventDefault();
                if (idx > -1 && idx < inputs.length - 1) {
                    inputs[idx + 1].focus();
                    inputs[idx + 1].select();
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (idx > 0) {
                    inputs[idx - 1].focus();
                    inputs[idx - 1].select();
                }
            }
        }

        // 5. محرك الحسابات التلقائية (CBC)
        function runCalculations(testId) {
            const getVal = (name) => {
                const el = document.getElementById(`inp_${testId}_${name}`);
                return el ? parseFloat(el.value) : NaN;
            };
            
            const setVal = (name, val) => {
                const el = document.getElementById(`inp_${testId}_${name}`);
                if (el && !isNaN(val)) el.value = val.toFixed(2);
            };

            const hb = getVal('HB');
            const rbc = getVal('RBC');
            const hct = getVal('HCT');

            // المعادلات
            if (!isNaN(hb) && !isNaN(rbc)) {
                const calcHct = hb * 3;
                setVal('HCT', calcHct);
                
                const calcMcv = (calcHct * 10) / rbc;
                setVal('MCV', calcMcv);
                
                const calcMch = (hb * 10) / rbc;
                setVal('MCH', calcMch);
                
                const calcMchc = (hb * 100) / calcHct;
                setVal('MCHC', calcMchc);
            }
        }

        // 6. دوال الحفظ
        function updateSingle(testId) {
            // مجرد دالة للتحديث المبدئي لو حبينا
        }

        async function saveSingle(testId) {
            const val = document.getElementById(`inp_${testId}`).value.trim();
            if (!val) return alert('اكتب النتيجة أولاً');

            const btn = document.getElementById(`btn_${testId}`);
            btn.innerText = 'جاري الحفظ...'; btn.disabled = true;

            try {
                await _supabase.from('test_results').upsert({
                    visit_test_id: testId,
                    results_data: { result: { value: val, flag: 'normal' } }
                }, { onConflict: 'visit_test_id' });
                
                btn.innerText = 'تم الحفظ ✅';
                setTimeout(() => loadData(), 1000);
            } catch(e) {
                alert('خطأ: ' + e.message);
                btn.innerText = 'حفظ'; btn.disabled = false;
            }
        }

        async function saveProfile(testId) {
            const test = currentVisit.tests.find(t => t.id === testId);
            const params = test.test_info.parameters || [];
            const resultsData = {};
            
            params.forEach(param => {
                const el = document.getElementById(`inp_${testId}_${param.name}`);
                if (el && el.value.trim()) {
                    resultsData[param.name] = { value: el.value.trim(), flag: 'normal' };
                }
            });

            const btn = document.getElementById(`btn_${testId}`);
            btn.innerText = 'جاري الحفظ...'; btn.disabled = true;

            try {
                await _supabase.from('test_results').upsert({
                    visit_test_id: testId,
                    results_data: resultsData
                }, { onConflict: 'visit_test_id' });
                
                btn.innerText = 'تم الحفظ ✅';
                setTimeout(() => loadData(), 1000);
            } catch(e) {
                alert('خطأ: ' + e.message);
                btn.innerText = 'حفظ'; btn.disabled = false;
            }
        }

        // 7. الطباعة (تجميع كل التحاليل)
        function printVisitReport() {
            if(!currentVisit) return alert('اختر مريض أولاً من القائمة');

            const p = currentVisit.patient;
            const pName = p.name || p.full_name || 'غير معروف';
            const gender = p.gender === 'female' ? 'أنثى' : 'ذكر';
            
            let rows = '';
            currentVisit.tests.forEach(t => {
                const params = t.test_info.parameters || [];
                const resData = t.result?.results_data || {};
                
                if (params.length > 0) {
                    // تحليل مركب
                    rows += `<tr><td colspan="5" style="background:#f1f5f9; font-weight:bold;">${t.test_info.name} (${t.test_code})</td></tr>`;
                    params.forEach(param => {
                        const res = resData[param.name]?.value || '-';
                        const ref = gender === 'أنثى' ? param.ref_female : param.ref_male;
                        rows += `<tr>
                            <td>${param.label}</td>
                            <td>${res}</td>
                            <td>${param.unit || '-'}</td>
                            <td>${ref || '-'}</td>
                            <td>-</td>
                        </tr>`;
                    });
                } else {
                    // تحليل فردي
                    const res = resData.result?.value || '-';
                    rows += `<tr>
                        <td>${t.test_info.name} (${t.test_code})</td>
                        <td>${res}</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                    </tr>`;
                }
            });

            const html = `
                <div style="text-align:center; margin-bottom: 20px;">
                    <h2>معامل طيبة للتحاليل الطبية</h2>
                    <p style="font-size: 1.1rem; margin-top:5px;">تقرير نتائج التحاليل</p>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom: 15px; font-size:0.95rem;">
                    <div><strong>المريض:</strong> ${pName}</div>
                    <div><strong>الزيارة:</strong> #${currentVisit.visit_id}</div>
                    <div><strong>التاريخ:</strong> ${new Date().toLocaleDateString('ar-EG')}</div>
                </div>
                <table class="print-table">
                    <thead>
                        <tr><th>الفحص</th><th>النتيجة</th><th>الوحدة</th><th>المدى المرجعي</th><th>الحالة</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;

            document.getElementById('printContent').innerHTML = html;
            document.getElementById('printModal').style.display = 'flex';
        }

        window.onload = loadData;
    </script>
</body>
</html>
